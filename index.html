<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>码字人日历 · 戏剧·诗歌·小说</title>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.6/400.css');
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.6/700.css');
    :root {
      --bg: #e9e2d2;
      --panel: #f7f1e2;
      --ink: #28261f;
      --muted: #6d675b;
      --accent: #b4432f;
      --line: rgba(40, 38, 31, .16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(180, 67, 47, .10), transparent 34%),
        radial-gradient(circle at 90% 100%, rgba(180, 67, 47, .07), transparent 38%),
        var(--bg);
      color: var(--ink);
      font-family: "PingFang TC", "PingFang SC", "Hiragino Sans GB", "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
    }
    main {
      width: min(100%, 620px);
      padding: 30px 18px 42px;
    }
    header {
      text-align: center;
      margin-bottom: 22px;
    }
    .kicker {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: .4em;
      color: var(--accent);
      font-weight: 500;
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: .08em;
    }
    .sub {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stage {
      display: flex;
      justify-content: center;
    }
    canvas {
      width: min(100%, 440px);
      height: auto;
      display: block;
      border-radius: 0;
      box-shadow:
        0 34px 64px rgba(55, 49, 42, .26),
        0 10px 22px rgba(55, 49, 42, .16),
        0 2px 6px rgba(55, 49, 42, .08);
      background: transparent;
    }
    .panel {
      margin: 18px auto 0;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .row-label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .auto-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }
    .auto-hint b { color: var(--accent); font-weight: 400; }
    .seg {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }
    .seg button, .seg label {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .seg button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #f7f1e2;
    }
    .seg label { cursor: pointer; }
    .seg label:active { background: var(--line); }
    .manual-fields {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .manual-fields.show {
      display: flex;
    }
    textarea, .manual-source {
      width: 100%;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffaf0;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      line-height: 1.7;
      padding: 10px 12px;
    }
    textarea { min-height: 64px; }
    .manual-source { min-height: 0; }
    textarea:focus, .manual-source:focus, button:focus-visible, label:focus-visible {
      outline: 2px solid rgba(180, 67, 47, .5);
      outline-offset: 1px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }
    .actions button {
      flex: 1;
      min-width: 120px;
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 11px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line) !important;
    }
    .primary {
      background: var(--ink);
      color: #f7f1e2;
      font-weight: 500;
    }
    .hidden { display: none !important; }
    .note {
      margin: 16px auto 0;
      max-width: 440px;
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(180, 67, 47, .10);
      color: var(--accent);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">戏剧 · 诗歌 · 小说</p>
      <h1>码字人日历</h1>
      <p class="sub" id="header-date">—</p>
    </header>

    <section class="stage" aria-label="今日码字人日历卡片预览">
      <canvas id="poster" width="1500" height="2000" aria-label="戏剧诗歌小说风格码字人日历卡片"></canvas>
    </section>

    <section class="panel" aria-label="卡片编辑">
      <div class="row">
        <span class="row-label">日期</span>
        <span class="auto-hint">自动生成 · <b id="date-hint">—</b></span>
      </div>

      <div class="row">
        <span class="row-label">文字</span>
        <div class="seg" role="group" aria-label="文字来源">
          <button type="button" id="text-auto" aria-pressed="true">自动</button>
          <button type="button" id="text-manual" aria-pressed="false">手写</button>
        </div>
      </div>
      <div class="manual-fields" id="manual-fields">
        <textarea id="manual-text" maxlength="60" placeholder="写一句今天想说的话"></textarea>
        <input class="manual-source" id="manual-source" maxlength="60" placeholder="来源，例如：海明威《老人与海》" />
      </div>

      <div class="row">
        <span class="row-label">配图</span>
        <div class="seg" role="group" aria-label="配图来源">
          <button type="button" class="img-mode" data-img="none" aria-pressed="true">无图</button>
          <button type="button" class="img-mode" data-img="auto" aria-pressed="false">自动</button>
          <label for="upload-file">上传图片</label>
          <input type="file" id="upload-file" accept="image/*" class="hidden" />
        </div>
      </div>

      <div class="actions">
        <button type="button" id="shuffle" class="secondary">换一句</button>
        <button type="button" id="swap-img" class="secondary hidden">换配图</button>
        <button type="button" id="download" class="primary">下载 PNG</button>
      </div>
    </section>

    <p class="note">
      日期于每日 00:00 后自动更新；自动摘句来自诗歌、话剧与小说并附出处，逢节气自动切换节气文案。<br/>
      想保存今天这张卡：点「下载 PNG」；在微信里长按卡片也可直接储存。
    </p>
  </main>

  <script>
    (function () {
      'use strict'

      /* ---------------- 日期 ---------------- */
      const WEEK_TEXT = '日一二三四五六'

      function pad(n) { return n < 10 ? '0' + n : '' + n }

      function dayOfYear(d) {
        const start = new Date(d.getFullYear(), 0, 0)
        return Math.floor((d - start) / 86400000)
      }

      function isLeap(y) {
        return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0
      }

      function getToday() {
        const now = new Date()
        const y = now.getFullYear()
        const m = now.getMonth() + 1
        const day = now.getDate()
        return {
          key: y + pad(m) + pad(day),
          year: y,
          month: m,
          day: day,
          dayText: pad(day),
          monthDay: m + '月' + day + '日',
          dateText: y + '年' + m + '月' + day + '日',
          weekday: '星期' + WEEK_TEXT[now.getDay()],
          yearDay: dayOfYear(now),
          totalDays: isLeap(y) ? 366 : 365
        }
      }

      /* ---------------- 素材 ---------------- */

      const TERM_NAMES = [

      const TERM_SECONDS = [

      function solarTermDay(year, index) {
        const offset = new Date(
          (31556925974.7 * (year - 1900) + TERM_SECONDS[index] * 60000) +
          Date.UTC(1900, 0, 6, 2, 5)
        )
        return offset.getUTCDate()
      }

      function currentSolarTerm(dateInfo) {
        for (let n = 0; n < TERM_NAMES.length; n++) {
          const month = Math.floor(n / 2) + 1
          const day = solarTermDay(dateInfo.year, n)
          if (dateInfo.month === month && dateInfo.day === day) {
            return { name: TERM_NAMES[n], index: n, month: month, day: day }
          }
        }
        return null
      }

      function termSeason(name) {
        const spring = ['立春', '雨水', '惊蛰', '春分', '清明', '谷雨']

        const autumn = ['立秋', '处暑', '白露', '秋分', '寒露', '霜降']
        const winter = ['立冬', '小雪', '大雪', '冬至', '小寒', '大寒']
        if (spring.indexOf(name) >= 0) return 'spring'
        if (summer.indexOf(name) >= 0) return 'summer'
        if (autumn.indexOf(name) >= 0) return 'autumn'
        if (winter.indexOf(name) >= 0) return 'winter'
        return ''
      }

      const TERM_QUOTES = {

        '清明': { text: '清明时节雨纷纷，路上行人欲断魂。', type: '诗歌', ref: '杜牧《清明》' },
        '谷雨': { text: '谷雨春光晓，山川黛色青。', type: '诗歌', ref: '元稹《咏廿四气诗·谷雨三月中》' },
        '立夏': { text: '槐柳阴初密，帘栊暑尚微。', type: '诗歌', ref: '陆游《立夏》' },

        '小暑': { text: '夜热依然午热同，开门小立月明中。', type: '诗歌', ref: '杨万里《夏夜追凉》' },

      const ARTS = [

      /* ---------------- 状态 ---------------- */

      const state = {
        date: getToday(),
        textMode: 'auto',
        quoteOffset: 0,
        manual: '',
        manualSource: '',
        imgMode: 'none',
        artIndex: 0,
        uploadedUrl: ''
      }

      let renderToken = 0

      const els = {
        headerDate: document.getElementById('header-date'),
        dateHint: document.getElementById('date-hint'),

        textManual: document.getElementById('text-manual'),

      /* ---------------- 文案 ---------------- */
      function daySeed(d) {
        return parseInt(d.key, 10)
      }

      function quoteIndex() {
        const base = daySeed(state.date) % QUOTES.length
        return (base + state.quoteOffset) % QUOTES.length
      }

      function getAutoEntry() {
        const term = currentSolarTerm(state.date)
        if (term && TERM_QUOTES[term.name]) {
          const season = termSeason(term.name)
          const pool = TERM_NAMES
            .filter(function (name) { return termSeason(name) === season && TERM_QUOTES[name] })
            .map(function (name) { return { name: name, quote: TERM_QUOTES[name] } })
          const currentIdx = pool.findIndex(function (item) { return item.name === term.name })
          const selected = pool[(currentIdx + state.quoteOffset) % pool.length]
          return Object.assign({}, selected.quote, {
            term: selected.name === term.name ? term.name : '',
            themes: [season, 'season', 'term', 'nature', 'poetry']
          })
        }
        return QUOTES[quoteIndex()]
      }

      function getQuoteText() {
        if (state.textMode === 'manual') {
          return state.manual.trim() || '写一句今天想说的话，会印在卡片上'
        }
        return getAutoEntry().text
      }

      function quoteSource() {
        if (state.textMode === 'manual') {
          return state.manualSource.trim()
        }
        const entry = getAutoEntry()
        const termTag = entry.term ? entry.term + ' · ' : ''
        return termTag + entry.type + ' · 摘自 ' + entry.ref
      }

      function matchedArts(entry) {
        const themes = entry.themes || []
        return ARTS.filter(function (art) {
          return art.themes.some(function (t) {
            return themes.indexOf(t) >= 0
          })
        })
      }

      function currentArt() {
        return ARTS[state.artIndex % ARTS.length]
      }

      function currentArtSvg() {
        return currentArt().svg
      }

      function chooseAutoArtIfNeeded() {
        if (state.imgMode !== 'auto' || state.textMode === 'manual') return
        const pool = matchedArts(getAutoEntry())
        if (!pool.length) return
        const cur = currentArt()
        const inside = pool.some(function (art) { return art.name === cur.name })
        if (!inside) {
          const pick = pool[daySeed(state.date) % pool.length]
          state.artIndex = ARTS.indexOf(pick)
        }
      }

      function advanceArt() {
        let pool
        if (state.textMode === 'manual') {
          pool = ARTS
        } else {
          pool = matchedArts(getAutoEntry())
          if (!pool.length) pool = ARTS
        }
        const cur = currentArt()
        let idx = pool.findIndex(function (art) { return art.name === cur.name })
        if (idx < 0) idx = 0
        const next = pool[(idx + 1) % pool.length]
        state.artIndex = ARTS.indexOf(next)
      }

      /* ---------------- Canvas 工具 ---------------- */
      const SERIF = '"Noto Serif SC","Songti SC","STSong","SimSun",serif'
      const SANS = '"PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif'

      function font(px, style) {
        return (style || '400') + ' ' + px + 'px ' + SERIF
      }

      function sansFont(px, weight) {
        return (weight || '400') + ' ' + px + 'px ' + SANS
      }

      function line(x1, y1, x2, y2, color, width, dash) {
        ctx.strokeStyle = color
        ctx.lineWidth = width
        ctx.setLineDash(dash || [])
        ctx.beginPath()
        ctx.moveTo(x1, y1)
        ctx.lineTo(x2, y2)
        ctx.stroke()
        ctx.setLineDash([])
      }

      function fillText(text, x, y, style) {
        ctx.font = style.font
        ctx.fillStyle = style.color
        ctx.textAlign = style.align || 'left'
        ctx.textBaseline = style.baseline || 'alphabetic'
        ctx.fillText(text, x, y)
      }

      function wrapByWidth(text, maxWidth, fontSpec) {
        ctx.font = fontSpec
        const chars = Array.from(text)
        const lines = []
        let cur = ''
        for (let i = 0; i < chars.length; i++) {
          const next = cur + chars[i]
          if (cur && ctx.measureText(next).width > maxWidth) {
            lines.push(cur)
            cur = chars[i]
          } else {
            cur = next
          }
        }
        if (cur) lines.push(cur)
        return lines
      }

      function loadSvg(svg) {
        return new Promise(function (resolve, reject) {
          const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }))
          const img = new Image()
          img.onload = function () { URL.revokeObjectURL(url); resolve(img) }
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('SVG 载入失败')) }
          img.src = url
        })
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.arcTo(x + w, y, x + w, y + h, r)
        ctx.arcTo(x + w, y + h, x, y + h, r)
        ctx.arcTo(x, y + h, x, y, r)
        ctx.arcTo(x, y, x + w, y, r)
        ctx.closePath()
      }

      /* ---------------- 背景与固定排版 ---------------- */
      function drawPaper() {
        ctx.fillStyle = '#f4ecdd'
        ctx.fillRect(0, 0, LW, LH)
        const g = ctx.createRadialGradient(610, 70, 10, 610, 70, 460)
        g.addColorStop(0, 'rgba(180,67,47,.055)')
        g.addColorStop(1, 'rgba(180,67,47,0)')
        ctx.fillStyle = g
        ctx.fillRect(0, 0, LW, LH)
      }

      function drawMasthead(d) {
        const x1 = 50
        const x2 = LW - 50
        line(x1, 48, x2, 48, '#28261f', 2.5)
        line(x1, 92, x2, 92, '#28261f', 1)

        fillText('戏剧·诗歌·小说', x1, 78, {
          font: font(22, '500'),
          color: '#28261f'
        })
        fillText('码字人日历', x2, 78, {
          font: font(21, '500'),
          color: '#b4432f',
          align: 'right'
        })

        // 红色齿孔装饰
        ctx.fillStyle = 'rgba(180,67,47,.72)'
        for (let x = 58; x <= x2 - 8; x += 16) {
          ctx.beginPath()
          ctx.arc(x, 107, 2.3, 0, Math.PI * 2)
          ctx.fill()
        }
      }

      function drawDate(d) {
        const dayText = d.monthDay
        ctx.font = font(58, '500')
        const dayWidth = Math.ceil(ctx.measureText(dayText).width)
        fillText(dayText, 50, 190, {
          font: font(58, '500'),
          color: '#28261f'
        })
        const metaX = 50 + dayWidth + 24
        fillText(d.year + '年', metaX, 168, {
          font: font(15),
          color: '#6d675b'
        })
        fillText(d.weekday, metaX, 190, {
          font: font(15),
          color: '#6d675b'
        })

        const issue = '第 ' + d.yearDay + ' 场'
        ctx.font = sansFont(15)
        const iw = Math.ceil(ctx.measureText(issue).width)
        const ix = LW - 50 - iw - 28
        ctx.fillStyle = '#b4432f'
        ctx.fillRect(ix, 150, iw + 28, 42)
        fillText(issue, ix + (iw + 28) / 2, 176, {
          font: sansFont(15),
          color: '#f4ecdd',
          align: 'center'
        })

        line(50, 212, LW - 50, 212, 'rgba(40,38,31,.45)', 1)
      }

      function drawImageBlock(img) {
        const maxW = LW - 96
        const maxH = 316
        let w = maxW
        let h = maxH
        if (img && isFinite(img.width) && img.width > 0 && img.height > 0) {
          const aspect = img.width / img.height
          if (aspect > maxW / maxH) {
            w = maxW
            h = w / aspect
          } else {
            h = maxH
            w = h * aspect
          }
        }
        const y = 238
        const x = (LW - w) / 2

        // 纸框：完整显示图片，不做拉伸或裁切
        line(x - 9, y - 9, x + w + 9, y - 9, '#28261f', 1.2)
        line(x + w + 9, y - 9, x + w + 9, y + h + 9, '#28261f', 1.2)
        line(x + w + 9, y + h + 9, x - 9, y + h + 9, '#28261f', 1.2)
        line(x - 9, y + h + 9, x - 9, y - 9, '#28261f', 1.2)
        line(x - 4, y - 4, x + w + 4, y - 4, 'rgba(40,38,31,.5)', 1)
        line(x + w + 4, y - 4, x + w + 4, y + h + 4, 'rgba(40,38,31,.5)', 1)
        line(x + w + 4, y + h + 4, x - 4, y + h + 4, 'rgba(40,38,31,.5)', 1)
        line(x - 4, y + h + 4, x - 4, y - 4, 'rgba(40,38,31,.5)', 1)

        if (img) {
          ctx.drawImage(img, x, y, w, h)
        } else {
          ctx.fillStyle = '#d9cfb8'
          ctx.fillRect(x, y, w, h)
        }

        return y + h + 24
      }

      function layoutQuote(quoteText, quoteTop) {
        const maxW = 650
        const top = quoteTop
        const availH = quoteTop > 400 ? (912 - 52 - quoteTop) : 610
        let size = quoteTop > 400 ? 27 : 33
        let lineHeight = 0
        let lines = []

        for (let guard = 0; guard < 8; guard++) {
          const spec = font(size, '400')
          lines = wrapByWidth(quoteText, maxW, spec)
          lineHeight = Math.round(size * 1.78)
          const fits = lines.length * lineHeight <= availH - 44
          if (fits || size <= 21) break
          size -= 2
        }

        const total = lines.length * lineHeight
        const y = top + Math.max(0, (availH - total - 44) / 2)
        return { lines: lines, size: size, lineHeight: lineHeight, y: y }
      }

      function drawQuote(d, quoteTop) {
        const quoteText = '「' + getQuoteText() + '」'
        const lay = layoutQuote(quoteText, quoteTop)

        for (let i = 0; i < lay.lines.length; i++) {
          fillText(lay.lines[i], 50, lay.y + i * lay.lineHeight + lay.size, {
            font: font(lay.size, '400'),
            color: '#28261f'
          })
        }

        const src = quoteSource()
        const srcY = lay.y + lay.lines.length * lay.lineHeight + 24
        fillText(src ? '—— ' + src : '', LW - 50, srcY, {
          font: sansFont(13),
          color: '#6d675b',
          align: 'right'
        })
      }

      function drawFooter(d) {
        line(50, 912, LW - 50, 912, 'rgba(40,38,31,.5)', 1, [2, 7])
        fillText('码字人日历 · 戏票存根', 50, 950, {
          font: sansFont(13),
          color: '#6d675b'
        })
        fillText('场次 ' + d.yearDay + ' / ' + d.totalDays, LW - 50, 950, {
          font: sansFont(13),
          color: '#6d675b',
          align: 'right'
        })
      }

      /* ---------------- 渲染 ---------------- */
      async function render() {
        const token = ++renderToken
        ctx.clearRect(0, 0, LW, LH)
        drawPaper()
        drawMasthead(state.date)
        drawDate(state.date)

        let img = null
        if (state.imgMode === 'auto') {
          try {
            img = await loadSvg(currentArtSvg())
          } catch (e) {
            img = null
          }
        } else if (state.imgMode === 'upload' && state.uploadedUrl) {
          try {
            img = await loadUrlImage(state.uploadedUrl)
          } catch (e) {
            img = null
          }
        }

        if (token !== renderToken) return
        let quoteTop = 250
        if (state.imgMode !== 'none') {
          quoteTop = drawImageBlock(img)
        }
        drawQuote(state.date, quoteTop)
        drawFooter(state.date)
      }

      function loadUrlImage(url) {
        return new Promise(function (resolve, reject) {
          const img = new Image()
          img.onload = function () { resolve(img) }
          img.onerror = function () { reject(new Error('图片载入失败')) }
          img.src = url
        })
      }

      /* ---------------- 下载 ---------------- */
      function downloadPng() {
        const d = state.date
        const name = '码字人日历-' + d.key + '.png'
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) {
            if (!blob) return
            triggerDownload(URL.createObjectURL(blob), name)
          }, 'image/png')
        } else {
          triggerDownload(canvas.toDataURL('image/png'), name)
        }
      }

      function triggerDownload(href, name) {
        const a = document.createElement('a')
        a.href = href
        a.download = name
        document.body.appendChild(a)
        a.click()
        a.remove()
      }

      /* ---------------- 介面 ---------------- */
      function syncControls() {
        els.textAuto.setAttribute('aria-pressed', String(state.textMode === 'auto'))
        els.textManual.setAttribute('aria-pressed', String(state.textMode === 'manual'))
        els.manualFields.classList.toggle('show', state.textMode === 'manual')
        if (state.textMode === 'manual') {
          if (document.activeElement !== els.manual) els.manual.value = state.manual
          if (document.activeElement !== els.manualSource) els.manualSource.value = state.manualSource
        }

        els.imgButtons.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.img === state.imgMode))
        })

        els.shuffle.classList.toggle('hidden', state.textMode !== 'auto')
        els.swapImg.classList.toggle('hidden', state.imgMode !== 'auto')

        els.headerDate.textContent =
          state.date.dateText + ' · ' + state.date.weekday + ' · 第 ' + state.date.yearDay + ' 场'
        els.dateHint.textContent = state.date.monthDay + ' ' + state.date.weekday
      }

      function saveManualToStorage() {
        try {
          const key = 'daily-calendar-manual-' + state.date.key
          if (state.manual.trim() || state.manualSource.trim()) {
            localStorage.setItem(key, JSON.stringify({ text: state.manual, source: state.manualSource }))
          }
          else localStorage.removeItem(key)
        } catch (e) { /* 忽略 */ }
      }

      function loadManualFromStorage() {
        try {
          const key = 'daily-calendar-manual-' + state.date.key
          const saved = localStorage.getItem(key)
          const data = saved ? JSON.parse(saved) : null
          state.manual = data && data.text ? data.text : ''
          state.manualSource = data && data.source ? data.source : ''
          els.manual.value = state.manual
          els.manualSource.value = state.manualSource
        } catch (e) { /* 忽略 */ }
      }

      els.textAuto.addEventListener('click', function () {
        state.textMode = 'auto'
        chooseAutoArtIfNeeded()
        syncControls()
        render()
      })

      els.textManual.addEventListener('click', function () {
        state.textMode = 'manual'
        syncControls()
        els.manual.focus()
        render()
      })

      els.manual.addEventListener('input', function () {
        state.manual = els.manual.value
        saveManualToStorage()
        render()
      })

      els.manualSource.addEventListener('input', function () {
        state.manualSource = els.manualSource.value
        saveManualToStorage()
        render()
      })

      els.imgButtons.forEach(function (b) {
        b.addEventListener('click', function () {
          state.imgMode = b.dataset.img
          if (b.dataset.img === 'auto') {
            chooseAutoArtIfNeeded()
          }
          syncControls()
          render()
        })
      })

      els.upload.addEventListener('change', function () {
        const file = els.upload.files && els.upload.files[0]
        if (!file) return
        const url = URL.createObjectURL(file)
        state.uploadedUrl = url
        state.imgMode = 'upload'
        syncControls()
        render()
        els.upload.value = ''
      })

      els.shuffle.addEventListener('click', function () {
        state.textMode = 'auto'
        state.quoteOffset += 1
        chooseAutoArtIfNeeded()
        syncControls()
        render()
      })

      els.swapImg.addEventListener('click', function () {
        advanceArt()
        render()
      })

      els.download.addEventListener('click', downloadPng)

      /* ---------------- 启动 ---------------- */
      function boot() {
        loadManualFromStorage()
        syncControls()
        render()
      }
      if (document.fonts && document.fonts.load) {
        Promise.all([
          document.fonts.load('400 20px "Noto Serif SC"'),
          document.fonts.load('700 20px "Noto Serif SC"'),
          document.fonts.load('400 20px "Noto Serif SC"', '码字人日历戏剧诗歌小说看水写')
        ]).then(boot, boot)
      } else {
        boot()
      }
    })()
  </script>
</body>
</html>
