<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>码字人日历 · 戏剧·诗歌·电影</title>
  <style>
    @import url('fonts/smiley/font.css');
    @import url('fonts/noto-serif/400.css');
    @import url('fonts/noto-serif/500.css');
    @import url('fonts/noto-serif/900.css');
    @import url('fonts/lxgw/regular.css');
    @import url('fonts/noto-sans/400.css');
    @import url('fonts/noto-sans/700.css');
    :root {
      --bg: #e9e2d2;
      --panel: #f7f1e2;
      --ink: #28261f;
      --muted: #6d675b;
      --accent: #b4432f;
      --line: rgba(40, 38, 31, .16);
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(180, 67, 47, .10), transparent 34%),
        radial-gradient(circle at 90% 100%, rgba(180, 67, 47, .07), transparent 38%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
    }
    main {
      width: min(100%, 620px);
      padding: 30px 18px 42px;
    }
    header {
      text-align: center;
      margin-bottom: 22px;
    }
    .kicker {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: .4em;
      color: var(--accent);
      font-weight: 500;
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: .08em;
    }
    .sub {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stage {
      display: flex;
      justify-content: center;
    }
    canvas {
      width: min(100%, 440px);
      height: auto;
      display: block;
      border-radius: 0;
      box-shadow:
        0 34px 64px rgba(55, 49, 42, .26),
        0 10px 22px rgba(55, 49, 42, .16),
        0 2px 6px rgba(55, 49, 42, .08);
      background: transparent;
    }
    .panel {
      margin: 18px auto 0;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .row-label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .auto-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }
    .auto-hint b { color: var(--accent); font-weight: 400; }
    .seg {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }
    .seg button, .seg label {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .seg button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #f7f1e2;
    }
    .seg label { cursor: pointer; }
    .seg label:active { background: var(--line); }
    .manual-fields {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .manual-fields.show {
      display: flex;
    }
    textarea, .manual-source {
      width: 100%;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffaf0;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.7;
      padding: 10px 12px;
    }
    textarea { min-height: 64px; }
    .manual-source { min-height: 0; }
    textarea:focus, .manual-source:focus, button:focus-visible, label:focus-visible {
      outline: 2px solid rgba(180, 67, 47, .5);
      outline-offset: 1px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }
    .actions button {
      flex: 1;
      min-width: 120px;
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 11px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line) !important;
    }
    .primary {
      background: var(--ink);
      color: #f7f1e2;
      font-weight: 500;
    }
    .hidden { display: none !important; }
    .note {
      margin: 16px auto 0;
      max-width: 440px;
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(180, 67, 47, .10);
      color: var(--accent);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">戏剧 · 诗歌 · 电影</p>
      <h1>码字人日历</h1>
      <p class="sub" id="header-date">—</p>
    </header>

    <section class="stage" aria-label="今日码字人日历卡片预览">
      <canvas id="poster" width="1500" height="2000" aria-label="戏剧诗歌电影风格码字人日历卡片"></canvas>
    </section>

    <section class="panel" aria-label="卡片编辑">
      <div class="row">
        <span class="row-label">日期</span>
        <span class="auto-hint">自动生成 · <b id="date-hint">—</b></span>
      </div>

      <div class="row">
        <span class="row-label">文字</span>
        <div class="seg" role="group" aria-label="文字来源">
          <button type="button" id="text-auto" aria-pressed="true">自动</button>
          <button type="button" id="text-manual" aria-pressed="false">手写</button>
        </div>
      </div>
      <div class="manual-fields" id="manual-fields">
        <textarea id="manual-text" maxlength="60" placeholder="写一句今天想说的话"></textarea>
        <input class="manual-source" id="manual-source" maxlength="60" placeholder="来源，例如：海明威《老人与海》" />
      </div>

      <div class="row">
        <span class="row-label">配图</span>
        <div class="seg" role="group" aria-label="配图来源">
          <button type="button" class="img-mode" data-img="none" aria-pressed="true">无图</button>
          <button type="button" class="img-mode" data-img="auto" aria-pressed="false">自动</button>
          <label for="upload-file">上传图片</label>
          <input type="file" id="upload-file" accept="image/*" class="hidden" />
        </div>
      </div>

      <div class="actions">
        <button type="button" id="shuffle" class="secondary">换一句</button>
        <button type="button" id="swap-img" class="secondary hidden">换配图</button>
      </div>
      <div class="actions">
        <button type="button" id="download" class="secondary">下载 PNG</button>
        <button type="button" id="download-jpg" class="secondary">下载 JPG</button>
      </div>
    </section>

    <p class="note">
      日期于每日 00:00 后自动更新；自动摘句来自诗歌、话剧与小说并附出处，逢节气自动切换节气文案。<br/>
      想保存今天这张卡：点「下载 PNG」；在微信里长按卡片也可直接储存。
    </p>
  </main>

  <script>
    (function () {
      'use strict'

      /* ---------------- 日期 ---------------- */
      const WEEK_TEXT = '日一二三四五六'

      function pad(n) { return n < 10 ? '0' + n : '' + n }

      function dayOfYear(d) {
        const start = new Date(d.getFullYear(), 0, 0)
        return Math.floor((d - start) / 86400000)
      }

      function isLeap(y) {
        return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0
      }

      function getToday() {
        const now = new Date()
        const y = now.getFullYear()
        const m = now.getMonth() + 1
        const day = now.getDate()
        return {
          key: y + pad(m) + pad(day),
          year: y,
          month: m,
          day: day,
          dayText: pad(day),
          monthDay: m + '月' + day + '日',
          dateText: y + '年' + m + '月' + day + '日',
          weekday: '星期' + WEEK_TEXT[now.getDay()],
          yearDay: dayOfYear(now),
          totalDays: isLeap(y) ? 366 : 365
        }
      }

      /* ---------------- 素材 ---------------- */
      const QUOTES = [
 {
  "text": "蒹葭苍苍，白露为霜。所谓伊人，在水一方。",
  "type": "诗歌",
  "ref": "《诗经·秦风·蒹葭》",
  "origin": "中",
  "themes": [
   "poetry",
   "autumn",
   "water"
  ]
 },
 {
  "text": "其实地上本没有路，走的人多了，也便成了路。",
  "type": "小说",
  "ref": "鲁迅《故乡》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "journey"
  ]
 },
 {
  "text": "全世界是一个舞台，所有的男男女女不过是演员。",
  "type": "话剧",
  "ref": "莎士比亚《皆大欢喜》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "采菊东篱下，悠然见南山。",
  "type": "诗歌",
  "ref": "陶渊明《饮酒·其五》",
  "origin": "中",
  "themes": [
   "poetry",
   "autumn",
   "nature"
  ]
 },
 {
  "text": "沉默呵，沉默呵！不在沉默中爆发，就在沉默中灭亡。",
  "type": "散文",
  "ref": "鲁迅《记念刘和珍君》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "生存还是毁灭，这是一个值得思考的问题。",
  "type": "话剧",
  "ref": "莎士比亚《哈姆雷特》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "海内存知己，天涯若比邻。",
  "type": "诗歌",
  "ref": "王勃《送杜少府之任蜀州》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "悄悄的我走了，正如我悄悄的来；我挥一挥衣袖，不带走一片云彩。",
  "type": "现代诗歌",
  "ref": "徐志摩《再别康桥》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "我们都在阴沟里，可是总有人还在仰望星空。",
  "type": "话剧",
  "ref": "王尔德《温夫人的扇子》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "明月松间照，清泉石上流。",
  "type": "诗歌",
  "ref": "王维《山居秋暝》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "night",
   "moon"
  ]
 },
 {
  "text": "你是爱，是暖，是希望，你是人间的四月天！",
  "type": "现代诗歌",
  "ref": "林徽因《你是人间的四月天》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "一个人可以被毁灭，但不能被打败。",
  "type": "小说",
  "ref": "海明威《老人与海》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "举杯邀明月，对影成三人。",
  "type": "诗歌",
  "ref": "李白《月下独酌》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "撑着油纸伞，独自彷徨在悠长、悠长又寂寥的雨巷。",
  "type": "现代诗歌",
  "ref": "戴望舒《雨巷》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain"
  ]
 },
 {
  "text": "所有的大人都曾经是小孩，虽然，只有少数的人记得。",
  "type": "小说",
  "ref": "圣埃克苏佩里《小王子》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "长风破浪会有时，直挂云帆济沧海。",
  "type": "诗歌",
  "ref": "李白《行路难》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "你站在桥上看风景，看风景的人在楼上看你。",
  "type": "现代诗歌",
  "ref": "卞之琳《断章》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "真正重要的东西，用眼睛是看不见的。",
  "type": "小说",
  "ref": "圣埃克苏佩里《小王子》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "随风潜入夜，润物细无声。",
  "type": "诗歌",
  "ref": "杜甫《春夜喜雨》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "nature"
  ]
 },
 {
  "text": "黑夜给了我黑色的眼睛，我却用它寻找光明。",
  "type": "现代诗歌",
  "ref": "顾城《一代人》",
  "origin": "中",
  "themes": [
   "poetry",
   "night"
  ]
 },
 {
  "text": "幸福的家庭都是相似的，不幸的家庭各有各的不幸。",
  "type": "小说",
  "ref": "托尔斯泰《安娜·卡列尼娜》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "露从今夜白，月是故乡明。",
  "type": "诗歌",
  "ref": "杜甫《月夜忆舍弟》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "草在结它的种子，风在摇它的叶子，我们站着，不说话，就十分美好。",
  "type": "现代诗歌",
  "ref": "顾城《门前》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "死并非生的对立面，而作为生的一部分永存。",
  "type": "小说",
  "ref": "村上春树《挪威的森林》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "停车坐爱枫林晚，霜叶红于二月花。",
  "type": "诗歌",
  "ref": "杜牧《山行》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "autumn",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "从明天起，做一个幸福的人，喂马，劈柴，周游世界。",
  "type": "现代诗歌",
  "ref": "海子《面朝大海，春暖花开》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "我这一生，尽是可耻的过去。",
  "type": "小说",
  "ref": "太宰治《人间失格》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "春蚕到死丝方尽，蜡炬成灰泪始干。",
  "type": "诗歌",
  "ref": "李商隐《无题》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "如何让你遇见我，在我最美丽的时刻。",
  "type": "现代诗歌",
  "ref": "席慕蓉《一棵开花的树》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。",
  "type": "小说",
  "ref": "川端康成《雪国》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "winter",
   "night"
  ]
 },
 {
  "text": "人有悲欢离合，月有阴晴圆缺，此事古难全。",
  "type": "诗歌",
  "ref": "苏轼《水调歌头》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "小时候，乡愁是一枚小小的邮票，我在这头，母亲在那头。",
  "type": "现代诗歌",
  "ref": "余光中《乡愁》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "明天又是新的一天。",
  "type": "小说",
  "ref": "玛格丽特·米切尔《飘》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "山重水复疑无路，柳暗花明又一村。",
  "type": "诗歌",
  "ref": "陆游《游山西村》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "journey",
   "nature"
  ]
 },
 {
  "text": "我行过许多地方的桥，看过许多次数的云，喝过许多种类的酒，却只爱过一个正当最好年龄的人。",
  "type": "小说",
  "ref": "沈从文《湘行散记》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "nature"
  ]
 },
 {
  "text": "人类的一切智慧是包含在这四个字里面的：等待和希望。",
  "type": "小说",
  "ref": "大仲马《基督山伯爵》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "冬天来了，春天还会远吗？",
  "type": "诗歌",
  "ref": "雪莱《西风颂》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "spring",
   "winter",
   "nature"
  ]
 },
 {
  "text": "婚姻是一座围城，城外的人想进去，城里的人想出来。",
  "type": "小说",
  "ref": "钱锺书《围城》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "假如生活欺骗了你，不要悲伤，不要心急！忧郁的日子里需要镇静。",
  "type": "诗歌",
  "ref": "普希金《假如生活欺骗了你》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "一片树林里分出两条路，而我选了人迹更少的一条，从此决定了我一生的道路。",
  "type": "诗歌",
  "ref": "弗罗斯特《未选择的路》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "journey",
   "nature"
  ]
 },
 {
  "text": "生命是一袭华美的袍，上面爬满了蚤子。",
  "type": "散文",

      function solarTermDay(year, index) {
        const offset = new Date(
          (31556925974.7 * (year - 1900) + TERM_SECONDS[index] * 60000) +
          Date.UTC(1900, 0, 6, 2, 5)
        )
        return offset.getUTCDate()
      }

      function currentSolarTerm(dateInfo) {
        for (let n = 0; n < TERM_NAMES.length; n++) {
          const month = Math.floor(n / 2) + 1
          const day = solarTermDay(dateInfo.year, n)
          if (dateInfo.month === month && dateInfo.day === day) {
            return { name: TERM_NAMES[n], index: n, month: month, day: day }
          }
        }
        return null

      const RAIN_LAMP =
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">' +
        '<rect width="400" height="300" fill="#403f3c"/>' +

        '<path d="M70 36l-22 28M112 24l-22 28M170 18l-20 26M76 92l-20 26M142 84l-22 28M206 92l-22 28"/>' +
        '</g>' +
        '<path d="M0 300 L0 252 C118 232 210 248 400 226 L400 300 Z" fill="#675647"/>' +
        '<path d="M96 170 L178 136 L188 182 L112 204 Z" fill="#3d5a4c"/>' +
        '<line x1="132" y1="168" x2="140" y2="252" stroke="#33261b" stroke-width="7"/>' +
        '<ellipse cx="150" cy="252" rx="70" ry="9" fill="#33261b"/>' +
        '<polygon points="98,168 180,134 182,152 104,190" fill="#f1d68a" opacity=".5"/>' +
        '</svg>'

      const BASE_SCENES = [
        { name: '红幕', themes: ['stage', 'drama', 'theater'], svg: CURTAIN },
        { name: '放映', themes: ['stage', 'drama', 'theater', 'film'], svg: PROJECTOR },
        { name: '手稿', themes: ['stage', 'drama', 'novel', 'book', 'study', 'poetry'], svg: SCRIPT_PAGE },
        { name: '墨月', themes: ['poetry', 'nature', 'water', 'autumn', 'winter', 'classic'], svg: INK_MOON },
        { name: '灯下', themes: ['novel', 'book', 'study', 'foreign', 'winter'], svg: DESK_LAMP },
        { name: '春窗', themes: ['spring', 'rain', 'water', 'nature', 'poetry'], svg: SPRING_WINDOW },
        { name: '夏野', themes: ['summer', 'nature', 'foreign', 'poetry'], svg: SUMMER_FIELD },
        { name: '秋月', themes: ['autumn', 'water', 'nature', 'poetry', 'novel'], svg: AUTUMN_MOON },
        { name: '冬夜', themes: ['winter', 'snow', 'novel', 'book', 'foreign'], svg: WINTER_NIGHT },
        { name: '月河', themes: ['moon', 'night', 'nature', 'water', 'poetry'], svg: MOON_RIVER },
        { name: '远路', themes: ['journey', 'nature', 'winter', 'foreign', 'novel'], svg: ROAD_SUN },
        { name: '雨灯', themes: ['rain', 'night', 'book', 'study', 'poetry'], svg: RAIN_LAMP }
      ]

      const ARTS = []
      for (let ai = 0; ai < 100; ai++) {
        const base = BASE_SCENES[ai % BASE_SCENES.length]
        const variant = Math.floor(ai / BASE_SCENES.length)
        const rotate = (variant * 39) % 360
        ARTS.push({
          name: base.name + '·' + (variant + 1),
          themes: base.themes.slice(),
          svg: base.svg,
          filter: 'sepia(.4) hue-rotate(' + rotate + 'deg) saturate(1.2) contrast(1.02)'
        })
      }

      /* ---------------- 状态 ---------------- */
      const canvas = document.getElementById('poster')
      const ctx = canvas.getContext('2d')
      const LW = 750
      const LH = 1000
      const SCALE = 2
      canvas.width = LW * SCALE
      canvas.height = LH * SCALE
      ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0)

      const state = {
        date: getToday(),
        textMode: 'auto',
        quoteOffset: 0,
        manual: '',
        manualSource: '',
        imgMode: 'none',
        artIndex: 0,
        uploadedUrl: ''
      }

      let renderToken = 0

      const els = {
        headerDate: document.getElementById('header-date'),
        dateHint: document.getElementById('date-hint'),
        textAuto: document.getElementById('text-auto'),
        textManual: document.getElementById('text-manual'),
        manual: document.getElementById('manual-text'),
        manualSource: document.getElementById('manual-source'),
        manualFields: document.getElementById('manual-fields'),
        imgButtons: Array.from(document.querySelectorAll('.img-mode')),
        upload: document.getElementById('upload-file'),
        shuffle: document.getElementById('shuffle'),
        swapImg: document.getElementById('swap-img'),
        download: document.getElementById('download'),
        downloadJpg: document.getElementById('download-jpg')
      }

      /* ---------------- 文案 ---------------- */
      function daySeed(d) {
        return parseInt(d.key, 10)
      }

      function quoteIndex() {
        const base = Math.max(0, state.date.yearDay - 1)
        return (base + state.quoteOffset) % QUOTES.length
      }

      function getAutoEntry() {
        const term = currentSolarTerm(state.date)
        if (term && TERM_QUOTES[term.name]) {
          const season = termSeason(term.name)
          const pool = TERM_NAMES
            .filter(function (name) { return termSeason(name) === season && TERM_QUOTES[name] })
            .map(function (name) { return { name: name, quote: TERM_QUOTES[name] } })
          const currentIdx = pool.findIndex(function (item) { return item.name === term.name })
          const selected = pool[(currentIdx + state.quoteOffset) % pool.length]
          return Object.assign({}, selected.quote, {
            term: selected.name === term.name ? term.name : '',
            themes: [season, 'season', 'term', 'nature', 'poetry']
          })
        }
        return QUOTES[quoteIndex()]
      }

      function getQuoteText() {
        if (state.textMode === 'manual') {
          return state.manual.trim() || '写一句今天想说的话，会印在卡片上'
        }
        return getAutoEntry().text
      }

      function quoteSource() {
        if (state.textMode === 'manual') {
          return state.manualSource.trim()
        }
        const entry = getAutoEntry()
        const termTag = entry.term ? entry.term + ' · ' : ''
        return termTag + entry.type + ' · 摘自 ' + entry.ref
      }

      function matchedArts(entry) {
        const themes = entry.themes || []
        return ARTS.filter(function (art) {
          return art.themes.some(function (t) {
            return themes.indexOf(t) >= 0
          })
        })
      }

      function currentArt() {
        return ARTS[state.artIndex % ARTS.length]
      }

      function currentArtSvg() {
        return currentArt().svg
      }

      function chooseAutoArtIfNeeded() {
        if (state.imgMode !== 'auto' || state.textMode === 'manual') return
        const pool = matchedArts(getAutoEntry())
        if (!pool.length) return
        const cur = currentArt()
        const inside = pool.some(function (art) { return art.name === cur.name })
        if (!inside) {
          const pick = pool[daySeed(state.date) % pool.length]
          state.artIndex = ARTS.indexOf(pick)
        }
      }

      function advanceArt() {
        let pool
        if (state.textMode === 'manual') {
          pool = ARTS
        } else {
          pool = matchedArts(getAutoEntry())
          if (!pool.length) pool = ARTS
        }
        const cur = currentArt()
        let idx = pool.findIndex(function (art) { return art.name === cur.name })
        if (idx < 0) idx = 0
        const next = pool[(idx + 1) % pool.length]
        state.artIndex = ARTS.indexOf(next)
      }

      /* ---------------- Canvas 工具 ---------------- */
      const SERIF = '"Noto Serif SC","Songti SC","STSong","SimSun",serif'
      const SANS = '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif'
      const DISPLAY = '"Smiley Sans Oblique","Smiley Sans","得意黑",sans-serif'
      const KAI = '"LXGW WenKai Screen","LXGW WenKai","Kaiti SC","STKaiti","KaiTi",serif'

      function font(px, style) {
        return (style || '400') + ' ' + px + 'px ' + SERIF
      }

      function sansFont(px, weight) {
        return (weight || '400') + ' ' + px + 'px ' + SANS
      }

      function displayFont(px, weight) {
        return (weight || '400') + ' ' + px + 'px ' + DISPLAY
      }

      function kaiFont(px, weight) {
        return (weight || '400') + ' ' + px + 'px ' + KAI
      }

      function line(x1, y1, x2, y2, color, width, dash) {
        ctx.strokeStyle = color
        ctx.lineWidth = width
        ctx.setLineDash(dash || [])
        ctx.beginPath()
        ctx.moveTo(x1, y1)
        ctx.lineTo(x2, y2)
        ctx.stroke()
        ctx.setLineDash([])
      }

      function fillText(text, x, y, style) {
        ctx.font = style.font
        ctx.fillStyle = style.color
        ctx.textAlign = style.align || 'left'
        ctx.textBaseline = style.baseline || 'alphabetic'
        ctx.fillText(text, x, y)
      }

      function wrapByWidth(text, maxWidth, fontSpec) {
        ctx.font = fontSpec
        const chars = Array.from(text)
        const lines = []
        let cur = ''
        for (let i = 0; i < chars.length; i++) {
          const next = cur + chars[i]
          if (cur && ctx.measureText(next).width > maxWidth) {
            lines.push(cur)
            cur = chars[i]
          } else {
            cur = next
          }
        }
        if (cur) lines.push(cur)
        return lines
      }

      function loadSvg(svg) {
        return new Promise(function (resolve, reject) {
          const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }))
          const img = new Image()
          img.onload = function () { URL.revokeObjectURL(url); resolve(img) }
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('SVG 载入失败')) }
          img.src = url
        })
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.arcTo(x + w, y, x + w, y + h, r)
        ctx.arcTo(x + w, y + h, x, y + h, r)
        ctx.arcTo(x, y + h, x, y, r)
        ctx.arcTo(x, y, x + w, y, r)
        ctx.closePath()
      }

      /* ---------------- 背景与固定排版 ---------------- */
      function drawPaper() {
        ctx.fillStyle = '#f4ecdd'
        ctx.fillRect(0, 0, LW, LH)
        const g = ctx.createRadialGradient(610, 70, 10, 610, 70, 460)
        g.addColorStop(0, 'rgba(180,67,47,.055)')
        g.addColorStop(1, 'rgba(180,67,47,0)')
        ctx.fillStyle = g
        ctx.fillRect(0, 0, LW, LH)
      }

      function drawMasthead(d) {
        const x1 = 50
        const x2 = LW - 50
        line(x1, 48, x2, 48, '#28261f', 2.5)
        line(x1, 92, x2, 92, '#28261f', 1)

        fillText('戏剧·诗歌·电影', x1, 78, {
          font: displayFont(22, '400'),
          color: '#28261f'
        })
        fillText('码字人日历', x2, 78, {
          font: displayFont(21, '400'),
          color: '#b4432f',
          align: 'right'
        })

        // 红色齿孔装饰
        ctx.fillStyle = 'rgba(180,67,47,.72)'
        for (let x = 58; x <= x2 - 8; x += 16) {
          ctx.beginPath()
          ctx.arc(x, 107, 2.3, 0, Math.PI * 2)
          ctx.fill()
        }
      }

      function drawDate(d) {
        const dayText = d.monthDay
        ctx.font = font(58, '900')
        const dayWidth = Math.ceil(ctx.measureText(dayText).width)
        fillText(dayText, 50, 190, {
          font: font(58, '900'),
          color: '#28261f'
        })
        const metaX = 50 + dayWidth + 24
        fillText(d.year + '年', metaX, 168, {
          font: font(15),
          color: '#6d675b'
        })
        fillText(d.weekday, metaX, 190, {
          font: font(15),
          color: '#6d675b'
        })

        const issue = '第 ' + d.yearDay + ' 场'
        ctx.font = sansFont(15)
        const iw = Math.ceil(ctx.measureText(issue).width)
        const ix = LW - 50 - iw - 28
        ctx.fillStyle = '#b4432f'
        ctx.fillRect(ix, 150, iw + 28, 42)
        fillText(issue, ix + (iw + 28) / 2, 176, {
          font: sansFont(15),
          color: '#f4ecdd',
          align: 'center'
        })

        line(50, 212, LW - 50, 212, 'rgba(40,38,31,.45)', 1)
      }

      function drawImageBlock(img) {
        const maxW = LW - 96
        const maxH = 316
        let w = maxW
        let h = maxH
        if (img && isFinite(img.width) && img.width > 0 && img.height > 0) {
          const aspect = img.width / img.height
          if (aspect > maxW / maxH) {
            w = maxW
            h = w / aspect
          } else {
            h = maxH
            w = h * aspect
          }
        }
        const y = 238
        const x = (LW - w) / 2

        // 纸框：完整显示图片，不做拉伸或裁切
        line(x - 9, y - 9, x + w + 9, y - 9, '#28261f', 1.2)
        line(x + w + 9, y - 9, x + w + 9, y + h + 9, '#28261f', 1.2)
        line(x + w + 9, y + h + 9, x - 9, y + h + 9, '#28261f', 1.2)
        line(x - 9, y + h + 9, x - 9, y - 9, '#28261f', 1.2)
        line(x - 4, y - 4, x + w + 4, y - 4, 'rgba(40,38,31,.5)', 1)
        line(x + w + 4, y - 4, x + w + 4, y + h + 4, 'rgba(40,38,31,.5)', 1)
        line(x + w + 4, y + h + 4, x - 4, y + h + 4, 'rgba(40,38,31,.5)', 1)
        line(x - 4, y + h + 4, x - 4, y - 4, 'rgba(40,38,31,.5)', 1)

        if (img) {
          if (state.imgMode === 'auto' && currentArt().filter && ctx.filter !== undefined) {
            ctx.save()
            ctx.filter = currentArt().filter
            ctx.drawImage(img, x, y, w, h)
            ctx.restore()
          } else {
            ctx.drawImage(img, x, y, w, h)
          }
        } else {
          ctx.fillStyle = '#d9cfb8'
          ctx.fillRect(x, y, w, h)
        }

        return y + h + 24
      }

      function layoutQuote(quoteText, quoteTop) {
        const maxW = LW - 156
        const top = quoteTop
        const availH = quoteTop > 400 ? (912 - 52 - quoteTop) : 610
        let size = quoteTop > 400 ? 32 : 40
        let lineHeight = 0
        let lines = []

        for (let guard = 0; guard < 8; guard++) {
          const spec = kaiFont(size, '400')
          lines = wrapByWidth(quoteText, maxW, spec)
          lineHeight = Math.round(size * 1.7)
          const fits = lines.length * lineHeight <= availH - 46
          if (fits || size <= 21) break
          size -= 2
        }

        const total = lines.length * lineHeight
        const y = top + Math.max(0, (availH - total - 46) / 2)
        return { lines: lines, size: size, lineHeight: lineHeight, y: y }
      }

      function drawQuote(d, quoteTop) {
        const quoteText = '「' + getQuoteText() + '」'
        const lay = layoutQuote(quoteText, quoteTop)

        for (let i = 0; i < lay.lines.length; i++) {
          fillText(lay.lines[i], 78, lay.y + i * lay.lineHeight + lay.size, {
            font: kaiFont(lay.size, '400'),
            color: '#28261f'
          })
        }

        const src = quoteSource()
        const lastBaseline = lay.y + (lay.lines.length - 1) * lay.lineHeight + lay.size
        const srcY = lastBaseline + 44
        fillText(src ? '—— ' + src : '', LW - 78, srcY, {
          font: sansFont(13),
          color: '#6d675b',
          align: 'right'
        })
      }

      function drawFooter(d) {
        line(50, 912, LW - 50, 912, 'rgba(40,38,31,.5)', 1, [2, 7])
        fillText('码字人日历 · 门票存根', 50, 950, {
          font: sansFont(13),
          color: '#6d675b'
        })
        fillText('场次 ' + d.yearDay + ' / ' + d.totalDays, LW - 50, 950, {
          font: sansFont(13),
          color: '#6d675b',
          align: 'right'
        })
      }

      /* ---------------- 渲染 ---------------- */
      function libraryQuoteText() {
        const parts = []
        QUOTES.forEach(function (q) {
          parts.push(q.text)
        })
        Object.keys(TERM_QUOTES).forEach(function (name) {
          parts.push(TERM_QUOTES[name].text)
        })
        return parts.join('')
      }

      function librarySourceText() {
        const parts = []
        QUOTES.forEach(function (q) {
          parts.push(q.ref)
        })
        Object.keys(TERM_QUOTES).forEach(function (name) {
          parts.push(TERM_QUOTES[name].ref)
        })
        parts.push('码字人日历门票存根场次出处摘自年月日星期——·')
        return parts.join('')
      }

      function waitRenderFonts() {
        if (!document.fonts || !document.fonts.load) return Promise.resolve()
        const quoteText = '「' + getQuoteText() + '」'
        const sansText = '—— ' + quoteSource() +
          '码字人日历 门票存根 场次 ' +
          state.date.year + ' ' + state.date.monthDay + ' ' +
          state.date.weekday
        const jobs = [
          document.fonts.load(displayFont(16), '码字人日历戏剧诗歌电影'),
          document.fonts.load(font(16, '900'), state.date.monthDay + state.date.weekday + state.date.year + '年第场日月'),
          document.fonts.load(kaiFont(16), quoteText),
          document.fonts.load(sansFont(16), sansText)
        ]
        const timeout = new Promise(function (resolve) {
          setTimeout(resolve, 8000)
        })
        return Promise.race([Promise.all(jobs), timeout])
      }

      async function render() {
        const token = ++renderToken
        await waitRenderFonts()
        if (token !== renderToken) return
        ctx.clearRect(0, 0, LW, LH)
        drawPaper()
        drawMasthead(state.date)
        drawDate(state.date)

        let img = null
        if (state.imgMode === 'auto') {
          try {
            img = await loadSvg(currentArtSvg())
          } catch (e) {
            img = null
          }
        } else if (state.imgMode === 'upload' && state.uploadedUrl) {
          try {
            img = await loadUrlImage(state.uploadedUrl)
          } catch (e) {
            img = null
          }
        }

        if (token !== renderToken) return
        let quoteTop = 250
        if (state.imgMode !== 'none') {
          quoteTop = drawImageBlock(img)
        }
        drawQuote(state.date, quoteTop)
        drawFooter(state.date)
      }

      function loadUrlImage(url) {
        return new Promise(function (resolve, reject) {
          const img = new Image()
          img.onload = function () { resolve(img) }
          img.onerror = function () { reject(new Error('图片载入失败')) }
          img.src = url
        })
      }

      /* ---------------- 下载 ---------------- */
      function downloadImage(kind) {
        const d = state.date
        const isPng = kind === 'png'
        const ext = isPng ? 'png' : 'jpg'
        const mime = isPng ? 'image/png' : 'image/jpeg'
        const name = '码字人日历-' + d.key + '.' + ext
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) {
            if (!blob) return
            triggerDownload(URL.createObjectURL(blob), name)
          }, mime, isPng ? undefined : 0.92)
        } else {
          triggerDownload(canvas.toDataURL(mime, isPng ? undefined : 0.92), name)
        }
      }

      function triggerDownload(href, name) {
        const a = document.createElement('a')
        a.href = href
        a.download = name
        document.body.appendChild(a)
        a.click()
        a.remove()
      }

      /* ---------------- 介面 ---------------- */
      function syncControls() {
        els.textAuto.setAttribute('aria-pressed', String(state.textMode === 'auto'))
        els.textManual.setAttribute('aria-pressed', String(state.textMode === 'manual'))
        els.manualFields.classList.toggle('show', state.textMode === 'manual')
        if (state.textMode === 'manual') {
          if (document.activeElement !== els.manual) els.manual.value = state.manual
          if (document.activeElement !== els.manualSource) els.manualSource.value = state.manualSource
        }

        els.imgButtons.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.img === state.imgMode))
        })

        els.shuffle.classList.toggle('hidden', state.textMode !== 'auto')
        els.swapImg.classList.toggle('hidden', state.imgMode !== 'auto')

        els.headerDate.textContent =
          state.date.dateText + ' · ' + state.date.weekday + ' · 第 ' + state.date.yearDay + ' 场'
        els.dateHint.textContent = state.date.monthDay + ' ' + state.date.weekday
      }

      function saveManualToStorage() {
        try {
          const key = 'daily-calendar-manual-' + state.date.key
          if (state.manual.trim() || state.manualSource.trim()) {
            localStorage.setItem(key, JSON.stringify({ text: state.manual, source: state.manualSource }))
          }
          else localStorage.removeItem(key)
        } catch (e) { /* 忽略 */ }
      }

      function loadManualFromStorage() {
        try {
          const key = 'daily-calendar-manual-' + state.date.key
          const saved = localStorage.getItem(key)
          const data = saved ? JSON.parse(saved) : null
          state.manual = data && data.text ? data.text : ''
          state.manualSource = data && data.source ? data.source : ''
          els.manual.value = state.manual
          els.manualSource.value = state.manualSource
        } catch (e) { /* 忽略 */ }
      }

      els.textAuto.addEventListener('click', function () {
        state.textMode = 'auto'
        chooseAutoArtIfNeeded()
        syncControls()
        render()
      })

      els.textManual.addEventListener('click', function () {
        state.textMode = 'manual'
        syncControls()
        els.manual.focus()
        render()
      })

      els.manual.addEventListener('input', function () {
        state.manual = els.manual.value
        saveManualToStorage()
        render()
      })

      els.manualSource.addEventListener('input', function () {
        state.manualSource = els.manualSource.value
        saveManualToStorage()
        render()
      })

      els.imgButtons.forEach(function (b) {
        b.addEventListener('click', function () {
          state.imgMode = b.dataset.img
          if (b.dataset.img === 'auto') {
            chooseAutoArtIfNeeded()
          }
          syncControls()
          render()
        })
      })

      els.upload.addEventListener('change', function () {
        const file = els.upload.files && els.upload.files[0]
        if (!file) return
        const url = URL.createObjectURL(file)
        state.uploadedUrl = url
        state.imgMode = 'upload'
        syncControls()
        render()
        els.upload.value = ''
      })

      els.shuffle.addEventListener('click', function () {
        state.textMode = 'auto'
        state.quoteOffset += 1
        chooseAutoArtIfNeeded()
        syncControls()
        render()
      })

      els.swapImg.addEventListener('click', function () {
        advanceArt()
        render()
      })

      els.download.addEventListener('click', function () {
        downloadImage('png')
      })
      els.downloadJpg.addEventListener('click', function () {
        downloadImage('jpg')
      })

      /* ---------------- 启动 ---------------- */
      function preloadLibraryFonts() {
        if (!document.fonts || !document.fonts.load) return
        document.fonts.load(kaiFont(16), libraryQuoteText()).catch(function () {})
        document.fonts.load(sansFont(16), librarySourceText()).catch(function () {})
      }

      function boot() {
        loadManualFromStorage()
        syncControls()
        render().then(function () {
          preloadLibraryFonts()
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
              render()
            })
          }
        })
      }
      boot()
    })()
  </script>
</body>
</html>
