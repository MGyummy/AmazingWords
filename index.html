<!doctype html>
<html lang="zh-Hans">
<head>

    body {

    }

      margin-bottom: 22px;
    }

    h1 {

    .stage {

      height: auto;

    }
    .panel {
      margin: 18px auto 0;
      max-width: 440px;
      background: var(--panel);

      border-radius: 14px;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .row-label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .auto-hint {

      color: var(--muted);
      text-align: right;
    }
    .auto-hint b { color: var(--accent); font-weight: 400; }
    .seg {

      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }
    .seg button, .seg label {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .seg button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #f7f1e2;
    }
    .seg label { cursor: pointer; }
    .seg label:active { background: var(--line); }
    .manual-fields {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .manual-fields.show {
      display: flex;
    }
    textarea, .manual-source {
      width: 100%;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffaf0;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.7;

    .manual-source { min-height: 0; }
    textarea:focus, .manual-source:focus, button:focus-visible, label:focus-visible {

      outline-offset: 1px;
    }
    .actions {

      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }

      flex: 1;
      min-width: 120px;
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 11px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .secondary {

      color: var(--ink);

    }
    .primary {
      background: var(--ink);
      color: #f7f1e2;
      font-weight: 500;
    }
    .hidden { display: none !important; }
    .note {
      margin: 16px auto 0;

      text-align: center;
      font-size: 11px;
      line-height: 1.8;
      color: var(--muted);
    }

      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(180, 67, 47, .10);
      color: var(--accent);

  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">戏剧 · 诗歌 · 电影</p>
      <h1>码字人日历</h1>
      <p class="sub" id="header-date">—</p>
    </header>

    <section class="stage" aria-label="今日码字人日历卡片预览">
      <canvas id="poster" width="1500" height="2000" aria-label="戏剧诗歌电影风格码字人日历卡片"></canvas>
    </section>

    <section class="panel" aria-label="卡片编辑">
      <div class="row">
        <span class="row-label">日期</span>
        <span class="auto-hint">自动生成 · <b id="date-hint">—</b></span>
      </div>

      <div class="row">
        <span class="row-label">文字</span>
        <div class="seg" role="group" aria-label="文字来源">
          <button type="button" id="text-auto" aria-pressed="true">自动</button>
          <button type="button" id="text-manual" aria-pressed="false">手写</button>
        </div>
      </div>
      <div class="manual-fields" id="manual-fields">
        <textarea id="manual-text" maxlength="60" placeholder="写一句今天想说的话"></textarea>
        <input class="manual-source" id="manual-source" maxlength="60" placeholder="来源，例如：海明威《老人与海》" />
      </div>

      <div class="row">
        <span class="row-label">配图</span>
        <div class="seg" role="group" aria-label="配图来源">
          <button type="button" class="img-mode" data-img="none" aria-pressed="true">无图</button>
          <button type="button" class="img-mode" data-img="auto" aria-pressed="false">自动</button>
          <label for="upload-file">上传图片</label>
          <input type="file" id="upload-file" accept="image/*" class="hidden" />
        </div>
      </div>

      <div class="actions">
        <button type="button" id="shuffle" class="secondary">换一句</button>
        <button type="button" id="swap-img" class="secondary hidden">换配图</button>
      </div>
      <div class="actions">
        <button type="button" id="download" class="secondary">下载 PNG</button>
        <button type="button" id="download-jpg" class="secondary">下载 JPG</button>
      </div>
    </section>

    <p class="note">
      日期于每日 00:00 后自动更新；自动摘句来自诗歌、话剧与小说并附出处，逢节气自动切换节气文案。<br/>
      想保存今天这张卡：点「下载 PNG」；在微信里长按卡片也可直接储存。
    </p>
  </main>

  <script>
    (function () {
      'use strict'

      /* ---------------- 日期 ---------------- */
      const WEEK_TEXT = '日一二三四五六'

      function pad(n) { return n < 10 ? '0' + n : '' + n }

      function dayOfYear(d) {
        const start = new Date(d.getFullYear(), 0, 0)
        return Math.floor((d - start) / 86400000)
      }

      function isLeap(y) {
        return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0
      }

      function getToday() {
        const now = new Date()
        const y = now.getFullYear()
        const m = now.getMonth() + 1
        const day = now.getDate()
        return {
          key: y + pad(m) + pad(day),
          year: y,
          month: m,
          day: day,
          dayText: pad(day),
          monthDay: m + '月' + day + '日',
          dateText: y + '年' + m + '月' + day + '日',
          weekday: '星期' + WEEK_TEXT[now.getDay()],
          yearDay: dayOfYear(now),
          totalDays: isLeap(y) ? 366 : 365
        }
      }

      /* ---------------- 素材 ---------------- */
      const QUOTES = [
 {
  "text": "关关雎鸠，在河之洲。窈窕淑女，君子好逑。",
  "type": "诗歌",
  "ref": "《诗经·周南·关雎》",
  "origin": "中",
  "themes": [
   "poetry",
   "water"
  ]
 },
 {
  "text": "其实地上本没有路，走的人多了，也便成了路。",
  "type": "小说",
  "ref": "鲁迅《故乡》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "journey"
  ]
 },
 {
  "text": "全世界是一个舞台，所有的男男女女不过是演员。",
  "type": "话剧",
  "ref": "莎士比亚《皆大欢喜》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "蒹葭苍苍，白露为霜。所谓伊人，在水一方。",
  "type": "诗歌",
  "ref": "《诗经·秦风·蒹葭》",
  "origin": "中",
  "themes": [
   "poetry",
   "autumn",
   "water"
  ]
 },
 {
  "text": "希望本是无所谓有，无所谓无的。",
  "type": "小说",
  "ref": "鲁迅《故乡》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "生存还是毁灭，这是一个值得思考的问题。",
  "type": "话剧",
  "ref": "莎士比亚《哈姆雷特》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "桃之夭夭，灼灼其华。",
  "type": "诗歌",
  "ref": "《诗经·周南·桃夭》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "从来如此，便对么？",
  "type": "小说",
  "ref": "鲁迅《狂人日记》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "名字有什么关系？把玫瑰花叫做别的名称，它还是照样芳香。",
  "type": "话剧",
  "ref": "莎士比亚《罗密欧与朱丽叶》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign",
   "spring"
  ]
 },
 {
  "text": "昔我往矣，杨柳依依。今我来思，雨雪霏霏。",
  "type": "诗歌",
  "ref": "《诗经·小雅·采薇》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "winter",
   "water",
   "rain"
  ]
 },
 {
  "text": "愿中国青年都摆脱冷气，只是向上走。",
  "type": "散文",
  "ref": "鲁迅《热风·随感录四十一》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "人生不过是一个行走的影子，一个在舞台上指手画脚的拙劣的伶人。",
  "type": "话剧",
  "ref": "莎士比亚《麦克白》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign",
   "journey"
  ]
 },
 {
  "text": "路漫漫其修远兮，吾将上下而求索。",
  "type": "诗歌",
  "ref": "屈原《离骚》",
  "origin": "中",
  "themes": [
   "poetry",
   "journey"
  ]
 },
 {
  "text": "沉默呵，沉默呵！不在沉默中爆发，就在沉默中灭亡。",
  "type": "散文",
  "ref": "鲁迅《记念刘和珍君》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "黑夜无论怎样悠长，白昼总会到来。",
  "type": "话剧",
  "ref": "莎士比亚《麦克白》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign",
   "night"
  ]
 },
 {
  "text": "亦余心之所善兮，虽九死其犹未悔。",
  "type": "诗歌",
  "ref": "屈原《离骚》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "当我沉默着的时候，我觉得充实；我将开口，同时感到空虚。",
  "type": "散文",
  "ref": "鲁迅《野草·题辞》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "我们都在阴沟里，可是总有人还在仰望星空。",
  "type": "话剧",
  "ref": "王尔德《温夫人的扇子》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "少壮不努力，老大徒伤悲。",
  "type": "诗歌",
  "ref": "《长歌行》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "是的，那是孤独的雪，是死掉的雨，是雨的精魂。",
  "type": "散文",
  "ref": "鲁迅《雪》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "winter",
   "water",
   "rain"
  ]
 },
 {
  "text": "首先我是一个人，跟你一样的一个人——至少我要学做一个人。",
  "type": "话剧",
  "ref": "易卜生《玩偶之家》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "对酒当歌，人生几何。譬如朝露，去日苦多。",
  "type": "诗歌",
  "ref": "曹操《短歌行》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "横眉冷对千夫指，俯首甘为孺子牛。",
  "type": "现代诗歌",
  "ref": "鲁迅《自嘲》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我们要活下去，我们要度过一连串漫长的夜晚，我们要耐心地忍受命运加给我们的考验。",
  "type": "话剧",
  "ref": "契诃夫《万尼亚舅舅》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign",
   "night"
  ]
 },
 {
  "text": "老骥伏枥，志在千里。烈士暮年，壮心不已。",
  "type": "诗歌",
  "ref": "曹操《龟虽寿》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "真的猛士，敢于直面惨淡的人生，敢于正视淋漓的鲜血。",
  "type": "散文",
  "ref": "鲁迅《记念刘和珍君》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "到莫斯科去！到莫斯科去！",
  "type": "话剧",
  "ref": "契诃夫《三姊妹》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "采菊东篱下，悠然见南山。",
  "type": "诗歌",
  "ref": "陶渊明《饮酒·其五》",
  "origin": "中",
  "themes": [
   "poetry",
   "autumn",
   "nature"
  ]
 },
 {
  "text": "燕子去了，有再来的时候；杨柳枯了，有再青的时候。",

  "ref": "朱自清《匆匆》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "spring"
  ]
 },
 {
  "text": "生命就要过去了，可我好像还没有生活过。",
  "type": "话剧",
  "ref": "契诃夫《樱桃园》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "盛年不重来，一日难再晨。",
  "type": "诗歌",
  "ref": "陶渊明《杂诗》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "像针尖上一滴水滴在大海里，我的日子滴在时间的流里，没有声音，也没有影子。",
  "type": "散文",
  "ref": "朱自清《匆匆》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "water"
  ]
 },
 {
  "text": "我总是依赖陌生人的善意。",
  "type": "话剧",
  "ref": "田纳西·威廉斯《欲望号街车》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "天苍苍，野茫茫，风吹草低见牛羊。",
  "type": "诗歌",
  "ref": "《敕勒歌》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "盼望着，盼望着，东风来了，春天的脚步近了。",
  "type": "散文",
  "ref": "朱自清《春》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "spring",
   "nature"
  ]
 },
 {
  "text": "让暴风雨来得更猛烈些吧！",
  "type": "散文",
  "ref": "高尔基《海燕》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign",
   "water",
   "rain",
   "nature"
  ]
 },
 {
  "text": "海内存知己，天涯若比邻。",
  "type": "诗歌",
  "ref": "王勃《送杜少府之任蜀州》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "我与父亲不相见已二年余了，我最不能忘记的是他的背影。",
  "type": "散文",
  "ref": "朱自清《背影》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "幸福的家庭都是相似的，不幸的家庭各有各的不幸。",
  "type": "小说",
  "ref": "托尔斯泰《安娜·卡列尼娜》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。",
  "type": "诗歌",
  "ref": "陈子昂《登幽州台歌》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "月光如流水一般，静静地泻在这一片叶子和花上。",
  "type": "散文",
  "ref": "朱自清《荷塘月色》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "spring",
   "water",
   "night",
   "moon"
  ]
 },
 {
  "text": "最要紧的是，我们首先应该善良，其次要诚实，再其次是以后永远不要互相遗忘。",
  "type": "小说",
  "ref": "陀思妥耶夫斯基《卡拉马佐夫兄弟》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "欲穷千里目，更上一层楼。",
  "type": "诗歌",
  "ref": "王之涣《登鹳雀楼》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "悄悄的我走了，正如我悄悄的来；我挥一挥衣袖，不带走一片云彩。",
  "type": "现代诗歌",
  "ref": "徐志摩《再别康桥》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "今天，妈妈死了。也许是昨天，我不知道。",
  "type": "小说",
  "ref": "加缪《局外人》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "黄河远上白云间，一片孤城万仞山。",
  "type": "诗歌",
  "ref": "王之涣《凉州词》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "你我相逢在黑夜的海上，你有你的，我有我的，方向。",
  "type": "现代诗歌",
  "ref": "徐志摩《偶然》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "night"
  ]
 },
 {
  "text": "世上的罪恶差不多总是由愚昧无知造成的。",
  "type": "小说",
  "ref": "加缪《鼠疫》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "春眠不觉晓，处处闻啼鸟。",
  "type": "诗歌",
  "ref": "孟浩然《春晓》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "最是那一低头的温柔，像一朵水莲花不胜凉风的娇羞。",
  "type": "现代诗歌",
  "ref": "徐志摩《沙扬娜拉》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "nature"
  ]
 },
 {
  "text": "一个人可以被毁灭，但不能被打败。",
  "type": "小说",
  "ref": "海明威《老人与海》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "野旷天低树，江清月近人。",
  "type": "诗歌",
  "ref": "孟浩然《宿建德江》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "你是爱，是暖，是希望，你是人间的四月天！",
  "type": "现代诗歌",
  "ref": "林徽因《你是人间的四月天》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。",
  "type": "小说",
  "ref": "马尔克斯《百年孤独》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "winter"
  ]
 },
 {
  "text": "独在异乡为异客，每逢佳节倍思亲。",
  "type": "诗歌",
  "ref": "王维《九月九日忆山东兄弟》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "你是一树一树的花开，是燕在梁间呢喃。",
  "type": "现代诗歌",
  "ref": "林徽因《你是人间的四月天》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "nature"
  ]
 },
 {
  "text": "不可避免，苦杏仁的气味总是让他想起爱情受到挫折的命运。",
  "type": "小说",
  "ref": "马尔克斯《霍乱时期的爱情》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "spring"
  ]
 },
 {
  "text": "劝君更尽一杯酒，西出阳关无故人。",
  "type": "诗歌",
  "ref": "王维《送元二使安西》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "撑着油纸伞，独自彷徨在悠长、悠长又寂寥的雨巷。",
  "type": "现代诗歌",
  "ref": "戴望舒《雨巷》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain"
  ]
 },
 {
  "text": "一天早晨，格里高尔·萨姆沙从不安的睡梦中醒来，发现自己躺在床上变成了一只巨大的甲虫。",
  "type": "小说",
  "ref": "卡夫卡《变形记》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "大漠孤烟直，长河落日圆。",
  "type": "诗歌",
  "ref": "王维《使至塞上》",
  "origin": "中",
  "themes": [
   "poetry",
   "water"
  ]
 },
 {
  "text": "我希望逢着一个丁香一样地结着愁怨的姑娘。",
  "type": "现代诗歌",
  "ref": "戴望舒《雨巷》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我只想当个麦田里的守望者。",
  "type": "小说",
  "ref": "塞林格《麦田里的守望者》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "行到水穷处，坐看云起时。",
  "type": "诗歌",
  "ref": "王维《终南别业》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "北国的秋，却特别地来得清，来得静，来得悲凉。",
  "type": "散文",
  "ref": "郁达夫《故都的秋》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "autumn"
  ]
 },
 {
  "text": "于是我们奋力前行，逆水行舟，被不断地向后推，被推入过去。",
  "type": "小说",
  "ref": "菲茨杰拉德《了不起的盖茨比》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "water"
  ]
 },
 {
  "text": "明月松间照，清泉石上流。",
  "type": "诗歌",
  "ref": "王维《山居秋暝》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "night",
   "moon"
  ]
 },
 {
  "text": "人要做有用的人，不要做只讲体面，而对别人没有好处的人。",
  "type": "散文",
  "ref": "许地山《落花生》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "所有的大人都曾经是小孩，虽然，只有少数的人记得。",
  "type": "小说",
  "ref": "圣埃克苏佩里《小王子》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "空山新雨后，天气晚来秋。",
  "type": "诗歌",
  "ref": "王维《山居秋暝》",
  "origin": "中",
  "themes": [
   "poetry",
   "autumn",
   "water",
   "rain",
   "nature"
  ]
 },
 {
  "text": "故乡对于我并没有什么特别的情分，只因朝夕会面，遂成相识。",
  "type": "散文",
  "ref": "周作人《故乡的野菜》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "正是你为你的玫瑰花费的时间，才使你的玫瑰变得如此重要。",
  "type": "小说",
  "ref": "圣埃克苏佩里《小王子》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "spring"
  ]
 },
 {
  "text": "空山不见人，但闻人语响。",
  "type": "诗歌",
  "ref": "王维《鹿柴》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着。",
  "type": "散文",
  "ref": "老舍《济南的冬天》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "water",
   "nature"
  ]
 },
 {
  "text": "真正重要的东西，用眼睛是看不见的。",
  "type": "小说",
  "ref": "圣埃克苏佩里《小王子》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "故人西辞黄鹤楼，烟花三月下扬州。",
  "type": "诗歌",
  "ref": "李白《黄鹤楼送孟浩然之广陵》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "night",
   "moon"
  ]
 },
 {
  "text": "雨下给富人，也下给穷人；下给义人，也下给不义的人。",
  "type": "小说",
  "ref": "老舍《骆驼祥子》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "water",
   "rain"
  ]
 },
 {
  "text": "你在下午四点钟来，那么从三点钟起，我就开始感到幸福。",
  "type": "小说",
  "ref": "圣埃克苏佩里《小王子》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "孤帆远影碧空尽，唯见长江天际流。",
  "type": "诗歌",
  "ref": "李白《黄鹤楼送孟浩然之广陵》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "我爱咱们的国呀，可是谁爱我呢？",
  "type": "话剧",
  "ref": "老舍《茶馆》",
  "origin": "中",
  "themes": [
   "stage",
   "drama"
  ]
 },
 {
  "text": "如果你驯养了我，我们就会彼此需要。",
  "type": "小说",
  "ref": "圣埃克苏佩里《小王子》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "床前明月光，疑是地上霜。",
  "type": "诗歌",
  "ref": "李白《静夜思》",
  "origin": "中",
  "themes": [
   "poetry",
   "autumn",
   "night",
   "moon"
  ]
 },
 {
  "text": "改良！改良！越改越凉，冰凉！",
  "type": "话剧",
  "ref": "老舍《茶馆》",
  "origin": "中",
  "themes": [
   "stage",
   "drama",
   "winter"
  ]
 },
 {
  "text": "你以为，因为我穷、低微、不美、矮小，我就没有灵魂，没有心吗？你想错了！",
  "type": "小说",
  "ref": "夏洛蒂·勃朗特《简·爱》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "飞流直下三千尺，疑是银河落九天。",
  "type": "诗歌",
  "ref": "李白《望庐山瀑布》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "墙角的花！你孤芳自赏时，天地便小了。",
  "type": "现代诗歌",
  "ref": "冰心《繁星》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "nature"
  ]
 },
 {
  "text": "我已经老了。有一天，在一处公共场所的大厅里，有一个男人向我走来。",
  "type": "小说",
  "ref": "杜拉斯《情人》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "天生我材必有用，千金散尽还复来。",
  "type": "诗歌",
  "ref": "李白《将进酒》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "成功的花，人们只惊羡她现时的明艳！",
  "type": "现代诗歌",
  "ref": "冰心《繁星》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "与你那时的面貌相比，我更爱你现在备受摧残的面容。",
  "type": "小说",
  "ref": "杜拉斯《情人》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "长风破浪会有时，直挂云帆济沧海。",
  "type": "诗歌",
  "ref": "李白《行路难》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "童年是梦中的真，是真中的梦，是回忆时含泪的微笑。",
  "type": "现代诗歌",
  "ref": "冰心《繁星》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "在很长一段时期里，我都是早早就躺下了。",
  "type": "小说",
  "ref": "普鲁斯特《追忆似水年华》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "桃花潭水深千尺，不及汪伦送我情。",
  "type": "诗歌",
  "ref": "李白《赠汪伦》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water"
  ]
 },
 {
  "text": "你站在桥上看风景，看风景的人在楼上看你。",
  "type": "现代诗歌",
  "ref": "卞之琳《断章》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "当一个人不能拥有的时候，他唯一能做的便是令自己不要忘记。",
  "type": "小说",
  "ref": "普鲁斯特《追忆似水年华》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "举杯邀明月，对影成三人。",
  "type": "诗歌",
  "ref": "李白《月下独酌》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "明月装饰了你的窗子，你装饰了别人的梦。",
  "type": "现代诗歌",
  "ref": "卞之琳《断章》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "一个人能使自己成为自己，比什么都重要。",
  "type": "散文",
  "ref": "伍尔夫《一间自己的房间》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign"
  ]
 },
 {
  "text": "浮云游子意，落日故人情。",
  "type": "诗歌",
  "ref": "李白《送友人》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "为什么我的眼里常含泪水？因为我对这土地爱得深沉。",
  "type": "现代诗歌",
  "ref": "艾青《我爱这土地》",
  "origin": "中",
  "themes": [
   "poetry",
   "water"
  ]
 },
 {
  "text": "明天又是新的一天。",
  "type": "小说",
  "ref": "玛格丽特·米切尔《飘》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "相看两不厌，只有敬亭山。",
  "type": "诗歌",
  "ref": "李白《独坐敬亭山》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "卑鄙是卑鄙者的通行证，高尚是高尚者的墓志铭。",
  "type": "现代诗歌",
  "ref": "北岛《回答》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "人类的一切智慧是包含在这四个字里面的：等待和希望。",
  "type": "小说",
  "ref": "大仲马《基督山伯爵》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "会当凌绝顶，一览众山小。",
  "type": "诗歌",
  "ref": "杜甫《望岳》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "黑夜给了我黑色的眼睛，我却用它寻找光明。",
  "type": "现代诗歌",
  "ref": "顾城《一代人》",
  "origin": "中",
  "themes": [
   "poetry",
   "night"
  ]
 },
 {
  "text": "哪个青年男子不善钟情？哪个妙龄少女不善怀春？",
  "type": "小说",
  "ref": "歌德《少年维特的烦恼》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "spring"
  ]
 },
 {
  "text": "国破山河在，城春草木深。",
  "type": "诗歌",
  "ref": "杜甫《春望》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "nature"
  ]
 },
 {
  "text": "草在结它的种子，风在摇它的叶子，我们站着，不说话，就十分美好。",
  "type": "现代诗歌",
  "ref": "顾城《门前》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "这是最好的时代，这是最坏的时代。",
  "type": "小说",
  "ref": "狄更斯《双城记》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "随风潜入夜，润物细无声。",
  "type": "诗歌",
  "ref": "杜甫《春夜喜雨》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "nature"
  ]
 },
 {
  "text": "我必须是你近旁的一株木棉，作为树的形象和你站在一起。",
  "type": "现代诗歌",
  "ref": "舒婷《致橡树》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "凡是有钱的单身汉，总想娶位太太，这已经成了一条举世公认的真理。",
  "type": "小说",
  "ref": "奥斯汀《傲慢与偏见》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "露从今夜白，月是故乡明。",
  "type": "诗歌",
  "ref": "杜甫《月夜忆舍弟》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "仿佛永远分离，却又终身相依。",
  "type": "现代诗歌",
  "ref": "舒婷《致橡树》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "死并非生的对立面，而作为生的一部分永存。",
  "type": "小说",
  "ref": "村上春树《挪威的森林》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "无边落木萧萧下，不尽长江滚滚来。",
  "type": "诗歌",
  "ref": "杜甫《登高》",
  "origin": "中",
  "themes": [
   "poetry",
   "water"
  ]
 },
 {
  "text": "与其在悬崖上展览千年，不如在爱人肩头痛哭一晚。",
  "type": "现代诗歌",
  "ref": "舒婷《神女峰》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我们领教了世界是何等凶顽，同时又得知世界也可以变得温存和美好。",
  "type": "小说",
  "ref": "村上春树《海边的卡夫卡》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "两个黄鹂鸣翠柳，一行白鹭上青天。",
  "type": "诗歌",
  "ref": "杜甫《绝句》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "从明天起，做一个幸福的人，喂马，劈柴，周游世界。",
  "type": "现代诗歌",
  "ref": "海子《面朝大海，春暖花开》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "人永远都无法知道自己该要什么，因为人只能活一次，既不能拿它跟前世相比，也不能在来生加以修正。",
  "type": "小说",
  "ref": "米兰·昆德拉《不能承受的生命之轻》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "白日放歌须纵酒，青春作伴好还乡。",
  "type": "诗歌",
  "ref": "杜甫《闻官军收河南河北》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "从明天起，关心粮食和蔬菜。我有一所房子，面朝大海，春暖花开。",
  "type": "现代诗歌",
  "ref": "海子《面朝大海，春暖花开》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "nature"
  ]
 },
 {
  "text": "发挥才智，则锋芒毕露；凭借感情，则流于世俗；坚持己见，则多方掣肘。总之，人世难居。",
  "type": "小说",
  "ref": "夏目漱石《草枕》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "此曲只应天上有，人间能得几回闻。",
  "type": "诗歌",
  "ref": "杜甫《赠花卿》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "陌生人，我也为你祝福，愿你有一个灿烂的前程。",
  "type": "现代诗歌",
  "ref": "海子《面朝大海，春暖花开》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我这一生，尽是可耻的过去。",
  "type": "小说",
  "ref": "太宰治《人间失格》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "忽如一夜春风来，千树万树梨花开。",
  "type": "诗歌",
  "ref": "岑参《白雪歌送武判官归京》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "night",
   "nature"
  ]
 },
 {
  "text": "姐姐，今夜我不关心人类，我只想你。",
  "type": "现代诗歌",
  "ref": "海子《日记》",
  "origin": "中",
  "themes": [
   "poetry",
   "night"
  ]
 },
 {
  "text": "穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。",
  "type": "小说",
  "ref": "川端康成《雪国》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign",
   "winter",
   "night"
  ]
 },
 {
  "text": "慈母手中线，游子身上衣。",
  "type": "诗歌",
  "ref": "孟郊《游子吟》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "如何让你遇见我，在我最美丽的时刻。",
  "type": "现代诗歌",
  "ref": "席慕蓉《一棵开花的树》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "凌晨四点钟，我看见海棠花未眠。",
  "type": "散文",
  "ref": "川端康成《花未眠》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign",
   "spring",
   "water"
  ]
 },
 {
  "text": "谁言寸草心，报得三春晖。",
  "type": "诗歌",
  "ref": "孟郊《游子吟》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "nature"
  ]
 },
 {
  "text": "而当你终于无视地走过，在你身后落了一地的，朋友啊，那不是花瓣，是我凋零的心。",
  "type": "现代诗歌",
  "ref": "席慕蓉《一棵开花的树》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "释放无限光明的是人心，制造无边黑暗的也是人心。",
  "type": "小说",
  "ref": "雨果《悲惨世界》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "鸟宿池边树，僧敲月下门。",
  "type": "诗歌",
  "ref": "贾岛《题李凝幽居》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "所有的结局都已写好，所有的泪水也都已启程。",
  "type": "现代诗歌",
  "ref": "席慕蓉《青春》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "journey"
  ]
 },
 {
  "text": "世界以痛吻我，要我报之以歌。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "秦时明月汉时关，万里长征人未还。",
  "type": "诗歌",
  "ref": "王昌龄《出塞》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "小时候，乡愁是一枚小小的邮票，我在这头，母亲在那头。",
  "type": "现代诗歌",
  "ref": "余光中《乡愁》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "如果你因失去了太阳而流泪，那么你也将失去群星了。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "洛阳亲友如相问，一片冰心在玉壶。",
  "type": "诗歌",
  "ref": "王昌龄《芙蓉楼送辛渐》",
  "origin": "中",
  "themes": [
   "poetry",
   "winter"
  ]
 },
 {
  "text": "长大后，乡愁是一张窄窄的船票，我在这头，新娘在那头。",
  "type": "现代诗歌",
  "ref": "余光中《乡愁》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "天空没有留下翅膀的痕迹，但我已经飞过。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "莫愁前路无知己，天下谁人不识君。",
  "type": "诗歌",
  "ref": "高适《别董大》",
  "origin": "中",
  "themes": [
   "poetry",
   "journey",
   "nature"
  ]
 },
 {
  "text": "等你，在雨中，在造虹的雨中。",
  "type": "现代诗歌",
  "ref": "余光中《等你，在雨中》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain"
  ]
 },
 {
  "text": "使生如夏花之绚烂，死如秋叶之静美。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "spring",
   "summer",
   "autumn"
  ]
 },
 {
  "text": "离离原上草，一岁一枯荣。",
  "type": "诗歌",
  "ref": "白居易《赋得古原草送别》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "我打江南走过，那等在季节里的容颜如莲花的开落。",
  "type": "现代诗歌",
  "ref": "郑愁予《错误》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water"
  ]
 },
 {
  "text": "我们把世界看错了，反说它欺骗我们。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "日出江花红胜火，春来江水绿如蓝。",
  "type": "诗歌",
  "ref": "白居易《忆江南》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water"
  ]
 },
 {
  "text": "我达达的马蹄是美丽的错误，我不是归人，是个过客。",
  "type": "现代诗歌",
  "ref": "郑愁予《错误》",
  "origin": "中",
  "themes": [
   "poetry",
   "journey"
  ]
 },
 {
  "text": "蜜蜂从花中啜蜜，离开时营营地道谢；蝴蝶却相信花是应该向他道谢的。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "spring"
  ]
 },
 {
  "text": "同是天涯沦落人，相逢何必曾相识。",
  "type": "诗歌",
  "ref": "白居易《琵琶行》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "长亭外，古道边，芳草碧连天。",
  "type": "现代诗歌",
  "ref": "李叔同《送别》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "我本可以忍受黑暗，如果我不曾见过太阳。",
  "type": "诗歌",
  "ref": "狄金森《如果我不曾见过太阳》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "在天愿作比翼鸟，在地愿为连理枝。",
  "type": "诗歌",
  "ref": "白居易《长恨歌》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "晚风拂柳笛声残，夕阳山外山。",
  "type": "现代诗歌",
  "ref": "李叔同《送别》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "希望是有羽毛的东西，栖息在灵魂里。",
  "type": "诗歌",
  "ref": "狄金森《希望》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "乱花渐欲迷人眼，浅草才能没马蹄。",
  "type": "诗歌",
  "ref": "白居易《钱塘湖春行》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "nature"
  ]
 },
 {
  "text": "天上飘着些微云，地上吹着些微风。啊，微风吹动了我头发，教我如何不想她？",
  "type": "现代诗歌",
  "ref": "刘半农《教我如何不想她》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "一片树林里分出两条路，而我选了人迹更少的一条，从此决定了我一生的道路。",
  "type": "诗歌",
  "ref": "弗罗斯特《未选择的路》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "journey",
   "nature"
  ]
 },
 {
  "text": "东边日出西边雨，道是无晴却有晴。",
  "type": "诗歌",
  "ref": "刘禹锡《竹枝词》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain"
  ]
 },
 {
  "text": "我们准备着深深地领受，那些意想不到的奇迹。",
  "type": "现代诗歌",
  "ref": "冯至《十四行集》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我辽阔广大，我包罗万象。",
  "type": "诗歌",
  "ref": "惠特曼《草叶集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "沉舟侧畔千帆过，病树前头万木春。",
  "type": "诗歌",
  "ref": "刘禹锡《酬乐天扬州初逢席上见赠》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "nature"
  ]
 },
 {
  "text": "这个人也许永远不回来了，也许“明天”回来。",
  "type": "小说",
  "ref": "沈从文《边城》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "nature"
  ]
 },
 {
  "text": "做一个世界的水手，奔赴所有的港口。",
  "type": "诗歌",
  "ref": "惠特曼《草叶集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "water"
  ]
 },
 {
  "text": "千淘万漉虽辛苦，吹尽狂沙始到金。",
  "type": "诗歌",
  "ref": "刘禹锡《浪淘沙》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我行过许多地方的桥，看过许多次数的云，喝过许多种类的酒，却只爱过一个正当最好年龄的人。",
  "type": "小说",
  "ref": "沈从文《湘行散记》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "nature"
  ]
 },
 {
  "text": "我闲步，还邀请了我的灵魂。",
  "type": "诗歌",
  "ref": "惠特曼《草叶集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "自古逢秋悲寂寥，我言秋日胜春朝。",
  "type": "诗歌",
  "ref": "刘禹锡《秋词》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "autumn"
  ]
 },
 {
  "text": "凡事都有偶然的凑巧，结果却又如宿命的必然。",
  "type": "小说",
  "ref": "沈从文《边城》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "谁此时没有房屋，就不必再建筑。谁此时孤独，就永远孤独。",
  "type": "诗歌",
  "ref": "里尔克《秋日》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "停车坐爱枫林晚，霜叶红于二月花。",
  "type": "诗歌",
  "ref": "杜牧《山行》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "autumn",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "婚姻是一座围城，城外的人想进去，城里的人想出来。",
  "type": "小说",
  "ref": "钱锺书《围城》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "要有耐心地对待心里所有尚未解决的事，要努力去爱问题本身。",
  "type": "散文",
  "ref": "里尔克《给青年诗人的信》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign"
  ]
 },
 {
  "text": "清明时节雨纷纷，路上行人欲断魂。",
  "type": "诗歌",
  "ref": "杜牧《清明》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "rain",
   "journey"
  ]
 },
 {
  "text": "城外的人想冲进去，城里的人想逃出来。",
  "type": "小说",
  "ref": "钱锺书《围城》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "我喜欢你是寂静的，仿佛你消失了一样。",
  "type": "诗歌",
  "ref": "聂鲁达《二十首情诗和一首绝望的歌》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "南朝四百八十寺，多少楼台烟雨中。",
  "type": "诗歌",
  "ref": "杜牧《江南春》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain"
  ]
 },
 {
  "text": "于千万人之中遇见你所要遇见的人，于千万年之中，时间的无涯的荒野里，没有早一步，也没有晚一步，刚巧赶上了。",
  "type": "散文",
  "ref": "张爱玲《爱》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "爱情如此短暂，遗忘如此漫长。",
  "type": "诗歌",
  "ref": "聂鲁达《今夜我可以写出最哀伤的诗》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "春蚕到死丝方尽，蜡炬成灰泪始干。",
  "type": "诗歌",
  "ref": "李商隐《无题》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "生命是一袭华美的袍，上面爬满了蚤子。",
  "type": "散文",
  "ref": "张爱玲《流言》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "我要在你身上去做，春天在樱桃树上做的事情。",
  "type": "诗歌",
  "ref": "聂鲁达《二十首情诗和一首绝望的歌》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "spring",
   "summer",
   "nature"
  ]
 },
 {
  "text": "何当共剪西窗烛，却话巴山夜雨时。",
  "type": "诗歌",
  "ref": "李商隐《夜雨寄北》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain",
   "night",
   "nature"
  ]
 },
 {
  "text": "也许每一个男子全都有过这样的两个女人，至少两个。",
  "type": "小说",
  "ref": "张爱玲《红玫瑰与白玫瑰》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "我给你瘦落的街道、绝望的落日、荒郊的月亮。",
  "type": "诗歌",
  "ref": "博尔赫斯《我用什么才能留住你》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "night",
   "moon"
  ]
 },
 {
  "text": "身无彩凤双飞翼，心有灵犀一点通。",
  "type": "诗歌",
  "ref": "李商隐《无题》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "娶了红玫瑰，久而久之，红的变了墙上的一抹蚊子血。",
  "type": "小说",
  "ref": "张爱玲《红玫瑰与白玫瑰》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "我给你关于你生命的诠释，关于你自己的理论，你的真实而惊人的存在。",
  "type": "诗歌",
  "ref": "博尔赫斯《我用什么才能留住你》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "夕阳无限好，只是近黄昏。",
  "type": "诗歌",
  "ref": "李商隐《登乐游原》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "传奇里的倾国倾城的人大抵如此。",
  "type": "小说",
  "ref": "张爱玲《倾城之恋》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "我心里一直在暗暗设想，天堂应该是图书馆的模样。",
  "type": "诗歌",
  "ref": "博尔赫斯《关于天赐的诗》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "曾经沧海难为水，除却巫山不是云。",
  "type": "诗歌",
  "ref": "元稹《离思》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "生活并不是悲剧。它是一场搏斗。",
  "type": "小说",
  "ref": "巴金《激流三部曲·总序》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "假如生活欺骗了你，不要悲伤，不要心急！忧郁的日子里需要镇静。",
  "type": "诗歌",
  "ref": "普希金《假如生活欺骗了你》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "千山鸟飞绝，万径人踪灭。",
  "type": "诗歌",
  "ref": "柳宗元《江雪》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "寒冷寂寞的生，却不如轰轰烈烈的死。",
  "type": "小说",
  "ref": "巴金《家》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "winter"
  ]
 },
 {
  "text": "一切都是瞬息，一切都将会过去；而那过去了的，就会成为亲切的怀恋。",
  "type": "诗歌",
  "ref": "普希金《假如生活欺骗了你》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "孤舟蓑笠翁，独钓寒江雪。",
  "type": "诗歌",
  "ref": "柳宗元《江雪》",
  "origin": "中",
  "themes": [
   "poetry",
   "winter",
   "water"
  ]
 },
 {
  "text": "那是力争上游的一种树，笔直的干，笔直的枝。",
  "type": "散文",
  "ref": "茅盾《白杨礼赞》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "nature"
  ]
 },
 {
  "text": "在那大海上淡蓝色的云雾里，有一片孤帆闪耀着白光。",
  "type": "诗歌",
  "ref": "莱蒙托夫《帆》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "water",
   "nature"
  ]
 },
 {
  "text": "春风又绿江南岸，明月何时照我还。",
  "type": "诗歌",
  "ref": "王安石《泊船瓜洲》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "女人抬头笑着问：今天怎么回来得这么晚？",
  "type": "小说",
  "ref": "孙犁《荷花淀》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "nature"
  ]
 },
 {
  "text": "当你老了，头白了，睡意昏沉，炉火旁打盹，请取下这部诗歌，慢慢读。",
  "type": "诗歌",
  "ref": "叶芝《当你老了》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "winter"
  ]
 },
 {
  "text": "不畏浮云遮望眼，自缘身在最高层。",
  "type": "诗歌",
  "ref": "王安石《登飞来峰》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "如果你来访我，我不在，请和我门外的花坐一会儿。",
  "type": "散文",
  "ref": "汪曾祺《人间草木》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "spring"
  ]
 },
 {
  "text": "四月是最残忍的月份，从死去的土地里培育出丁香。",
  "type": "诗歌",
  "ref": "艾略特《荒原》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "night",
   "moon"
  ]
 },
 {
  "text": "墙角数枝梅，凌寒独自开。",
  "type": "诗歌",
  "ref": "王安石《梅花》",
  "origin": "中",
  "themes": [
   "poetry",
   "winter"
  ]
 },
 {
  "text": "人活着，就得有点兴致。",
  "type": "散文",
  "ref": "汪曾祺《人间草木》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "时光流逝了，而我依然在这里。",
  "type": "诗歌",
  "ref": "阿波利奈尔《米拉波桥》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "不识庐山真面目，只缘身在此山中。",
  "type": "诗歌",
  "ref": "苏轼《题西林壁》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "我们有过各种创伤，但我们今天应该快乐。",
  "type": "散文",
  "ref": "汪曾祺《人间草木》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "nature"
  ]
 },
 {
  "text": "无边的悲戚，来自雨丝。",
  "type": "诗歌",
  "ref": "魏尔伦《泪流在我心里》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "water",
   "rain"
  ]
 },
 {
  "text": "竹外桃花三两枝，春江水暖鸭先知。",
  "type": "诗歌",
  "ref": "苏轼《惠崇春江晚景》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water"
  ]
 },
 {
  "text": "那一天我二十一岁，在我一生的黄金时代，我有好多奢望。",
  "type": "小说",
  "ref": "王小波《黄金时代》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "nature"
  ]
 },
 {
  "text": "你的孩子，其实不是你的孩子。他们是生命对于自身渴望而诞生的孩子。",
  "type": "散文",
  "ref": "纪伯伦《先知》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign"
  ]
 },
 {
  "text": "水光潋滟晴方好，山色空蒙雨亦奇。",
  "type": "诗歌",
  "ref": "苏轼《饮湖上初晴后雨》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain",
   "nature"
  ]
 },
 {
  "text": "我想爱，想吃，还想在一瞬间变成天上半明半暗的云。",
  "type": "小说",
  "ref": "王小波《黄金时代》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "nature"
  ]
 },
 {
  "text": "爱，除了自身别无所予，除了自身别无所取。",
  "type": "散文",
  "ref": "纪伯伦《先知》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign"
  ]
 },
 {
  "text": "人有悲欢离合，月有阴晴圆缺，此事古难全。",
  "type": "诗歌",
  "ref": "苏轼《水调歌头》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon"
  ]
 },
 {
  "text": "一想到你，我这张丑脸上就泛起微笑。",
  "type": "散文",
  "ref": "王小波《爱你就像爱生命》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "真正的光明决不是永没有黑暗的时间，只是永不被黑暗所掩蔽罢了。",
  "type": "小说",
  "ref": "罗曼·罗兰《约翰·克利斯朵夫》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "但愿人长久，千里共婵娟。",
  "type": "诗歌",
  "ref": "苏轼《水调歌头》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "一个人，出生了，这就不再是一个可以辩论的问题。",
  "type": "散文",
  "ref": "史铁生《我与地坛》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "世界上只有一种真正的英雄主义，那就是认清生活的真相后依然热爱生活。",
  "type": "散文",
  "ref": "罗曼·罗兰《米开朗琪罗传》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign"
  ]
 },
 {
  "text": "大江东去，浪淘尽，千古风流人物。",
  "type": "诗歌",
  "ref": "苏轼《念奴娇·赤壁怀古》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "死是一件不必急于求成的事，死是一个必然会降临的节日。",
  "type": "散文",
  "ref": "史铁生《我与地坛》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "希望迟迟不来，苦死了等的人。",
  "type": "话剧",
  "ref": "贝克特《等待戈多》",
  "origin": "外",
  "themes": [
   "stage",
   "drama",
   "foreign"
  ]
 },
 {
  "text": "回首向来萧瑟处，归去，也无风雨也无晴。",
  "type": "诗歌",
  "ref": "苏轼《定风波》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "rain",
   "journey",
   "nature"
  ]
 },
 {
  "text": "从前的日色变得慢，车、马、邮件都慢，一生只够爱一个人。",
  "type": "现代诗歌",
  "ref": "木心《从前慢》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "生活不是我们活过的日子，而是我们记住的日子。",
  "type": "小说",
  "ref": "马尔克斯《活着为了讲述》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "一年好景君须记，最是橙黄橘绿时。",
  "type": "诗歌",
  "ref": "苏轼《赠刘景文》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "从前的锁也好看，钥匙精美有样子，你锁了，人家就懂了。",
  "type": "现代诗歌",
  "ref": "木心《从前慢》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "你微微地笑着，不同我说什么话。而我觉得，为了这一刻，我已经等待了很久。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "生当作人杰，死亦为鬼雄。",
  "type": "诗歌",
  "ref": "李清照《夏日绝句》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "每想你一次，天上飘落一粒沙，从此形成了撒哈拉。",
  "type": "散文",
  "ref": "三毛《撒哈拉的故事》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "nature"
  ]
 },
 {
  "text": "我曾经受苦过，曾经失望过，曾经体会过死亡，于是我以我在这伟大的世界里为乐。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "知否，知否？应是绿肥红瘦。",
  "type": "诗歌",
  "ref": "李清照《如梦令》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我笑，便面如春花，定是能感动人的，任他是谁。",
  "type": "散文",
  "ref": "三毛《雨季不再来》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "spring"
  ]
 },
 {
  "text": "只管走过去，不必逗留着去采了花朵来保存，因为一路上，花朵自会继续开放。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "spring",
   "journey"
  ]
 },
 {
  "text": "此情无计可消除，才下眉头，却上心头。",
  "type": "诗歌",
  "ref": "李清照《一剪梅》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "生活不能等待别人来安排，要自己去争取和奋斗。",
  "type": "小说",
  "ref": "路遥《平凡的世界》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "使卵石臻于完美的，并非锤的打击，而是水的且歌且舞。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "water"
  ]
 },
 {
  "text": "山重水复疑无路，柳暗花明又一村。",
  "type": "诗歌",
  "ref": "陆游《游山西村》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "journey",
   "nature"
  ]
 },
 {
  "text": "人是为活着本身而活着，而不是为了活着之外的任何事物而活着。",
  "type": "小说",
  "ref": "余华《活着》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "世界对着它的爱人，把它浩瀚的面具揭下了。",
  "type": "诗歌",
  "ref": "泰戈尔《飞鸟集》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "纸上得来终觉浅，绝知此事要躬行。",
  "type": "诗歌",
  "ref": "陆游《冬夜读书示子聿》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "以笑的方式哭，在死亡的伴随下活着。",
  "type": "小说",
  "ref": "余华《活着》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "我能否把你比作夏天？你比夏天更可爱也更温婉。",
  "type": "诗歌",
  "ref": "莎士比亚《十四行诗·第十八首》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "summer",
   "nature"
  ]
 },
 {
  "text": "小楼一夜听春雨，深巷明朝卖杏花。",
  "type": "诗歌",
  "ref": "陆游《临安春雨初霁》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "rain",
   "night"
  ]
 },
 {
  "text": "没有什么比时间更具有说服力了，因为时间无需通知我们就可以改变一切。",
  "type": "小说",
  "ref": "余华《活着》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "爱并不因瞬息的改变而改变，它巍然矗立直到末日的尽头。",
  "type": "诗歌",
  "ref": "莎士比亚《十四行诗·第一一六首》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "小荷才露尖尖角，早有蜻蜓立上头。",
  "type": "诗歌",
  "ref": "杨万里《小池》",
  "origin": "中",
  "themes": [
   "poetry",
   "summer"
  ]
 },
 {
  "text": "高密东北乡无疑是地球上最美丽最丑陋、最超脱最世俗的地方。",
  "type": "小说",
  "ref": "莫言《红高粱》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "一沙一世界，一花一天堂。无限掌中置，刹那成永恒。",
  "type": "诗歌",
  "ref": "布莱克《天真的预言》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "spring",
   "nature"
  ]
 },
 {
  "text": "接天莲叶无穷碧，映日荷花别样红。",
  "type": "诗歌",
  "ref": "杨万里《晓出净慈寺送林子方》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "summer",
   "nature"
  ]
 },
 {
  "text": "世界上的事情，最忌讳的就是个十全十美。",
  "type": "小说",
  "ref": "莫言《檀香刑》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "冬天来了，春天还会远吗？",
  "type": "诗歌",
  "ref": "雪莱《西风颂》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "spring",
   "winter",
   "nature"
  ]
 },
 {
  "text": "等闲识得东风面，万紫千红总是春。",
  "type": "诗歌",
  "ref": "朱熹《春日》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "nature"
  ]
 },
 {
  "text": "太阳升起来了，黑暗留在后面。但是太阳不是我们的，我们要睡了。",
  "type": "话剧",
  "ref": "曹禺《日出》",
  "origin": "中",
  "themes": [
   "stage",
   "drama"
  ]
 },
 {
  "text": "美即是真，真即是美。",
  "type": "诗歌",
  "ref": "济慈《希腊古瓮颂》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "问渠那得清如许？为有源头活水来。",
  "type": "诗歌",
  "ref": "朱熹《观书有感》",
  "origin": "中",
  "themes": [
   "poetry",
   "water"
  ]
 },
 {
  "text": "年轻的时候，钱是好的，精神是好的；老了，什么都看穿了。",
  "type": "话剧",
  "ref": "曹禺《雷雨》",
  "origin": "中",
  "themes": [
   "stage",
   "drama"
  ]
 },
 {
  "text": "她走在美的光彩中，像夜晚皎洁无云而且繁星满天。",
  "type": "诗歌",
  "ref": "拜伦《她走在美的光彩中》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "night",
   "nature"
  ]
 },
 {
  "text": "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。",
  "type": "诗歌",
  "ref": "辛弃疾《青玉案·元夕》",
  "origin": "中",
  "themes": [
   "poetry",
   "night"
  ]
 },
 {
  "text": "树在。山在。大地在。岁月在。我在。你还要怎样更好的世界？",
  "type": "散文",
  "ref": "张晓风《我在》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "若我会见到你，事隔经年。我如何向你招呼？以眼泪，以沉默。",
  "type": "诗歌",
  "ref": "拜伦《春逝》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "稻花香里说丰年，听取蛙声一片。",
  "type": "诗歌",
  "ref": "辛弃疾《西江月·夜行黄沙道中》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "summer"
  ]
 },
 {
  "text": "我慢慢地、慢慢地了解到，所谓父女母子一场，只不过意味着，你和他的缘分就是今生今世不断地在目送他的背影渐行渐远。",
  "type": "散文",
  "ref": "龙应台《目送》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "乘着歌声的翅膀，心爱的人，我带你飞翔。",
  "type": "诗歌",
  "ref": "海涅《乘着歌声的翅膀》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "青山遮不住，毕竟东流去。",
  "type": "诗歌",
  "ref": "辛弃疾《菩萨蛮·书江西造口壁》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "人间最美是清欢。",
  "type": "散文",
  "ref": "林清玄《人生最美是清欢》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "一切的峰顶，沉静。一切的树尖，全不见丝儿风影。",
  "type": "诗歌",
  "ref": "歌德《浪游者的夜歌》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "nature"
  ]
 },
 {
  "text": "明月别枝惊鹊，清风半夜鸣蝉。",
  "type": "诗歌",
  "ref": "辛弃疾《西江月·夜行黄沙道中》",
  "origin": "中",
  "themes": [
   "poetry",
   "summer",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。",
  "type": "散文",
  "ref": "鲁迅《秋夜》",
  "origin": "中",
  "themes": [
   "book",
   "study",
   "nature"
  ]
 },
 {
  "text": "人生是实在的！人生是热烈的！人生的目标绝不是坟墓。",
  "type": "诗歌",
  "ref": "朗费罗《人生颂》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "三十功名尘与土，八千里路云和月。",
  "type": "诗歌",
  "ref": "岳飞《满江红》",
  "origin": "中",
  "themes": [
   "poetry",
   "night",
   "moon",
   "journey",
   "nature"
  ]
 },
 {
  "text": "一朵花，长在树上，才有它的美丽。",
  "type": "小说",
  "ref": "老舍《四世同堂》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "spring",
   "nature"
  ]
 },
 {
  "text": "当你启程前往伊萨卡，但愿你的道路漫长。",
  "type": "诗歌",
  "ref": "卡瓦菲斯《伊萨卡岛》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "journey"
  ]
 },
 {
  "text": "莫等闲，白了少年头，空悲切。",
  "type": "诗歌",
  "ref": "岳飞《满江红》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "青春是美丽的东西，而且这一直是鼓舞我的源泉。",
  "type": "小说",
  "ref": "巴金《家》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "spring",
   "water"
  ]
 },
 {
  "text": "他们彼此深信，是瞬间迸发的热情让他们相遇。",
  "type": "诗歌",
  "ref": "辛波斯卡《一见钟情》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "人生自古谁无死，留取丹心照汗青。",
  "type": "诗歌",
  "ref": "文天祥《过零丁洋》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "花开了，就像花睡醒了似的。鸟飞了，就像鸟上天了似的。",
  "type": "小说",
  "ref": "萧红《呼兰河传》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "spring",
   "nature"
  ]
 },
 {
  "text": "我想和你一起生活，在某个小镇，共享无尽的黄昏，和绵绵不绝的钟声。",
  "type": "诗歌",
  "ref": "茨维塔耶娃《我想和你一起生活》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "枯藤老树昏鸦，小桥流水人家，古道西风瘦马。",
  "type": "诗歌",
  "ref": "马致远《天净沙·秋思》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "土地是我的母亲，我的每一寸皮肤，都有着土粒。",
  "type": "散文",
  "ref": "端木蕻良《土地的誓言》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "二月。墨水足够用来痛哭！",
  "type": "诗歌",
  "ref": "帕斯捷尔纳克《二月》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "water",
   "night",
   "moon"
  ]
 },
 {
  "text": "夕阳西下，断肠人在天涯。",
  "type": "诗歌",
  "ref": "马致远《天净沙·秋思》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "人还要有点东西，才叫活着。",
  "type": "小说",
  "ref": "阿城《棋王》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "向着明亮那方，向着明亮那方。",
  "type": "诗歌",
  "ref": "金子美铃《向着明亮那方》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "落红不是无情物，化作春泥更护花。",
  "type": "诗歌",
  "ref": "龚自珍《己亥杂诗》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring"
  ]
 },
 {
  "text": "日子是过以后，不是过从前。",
  "type": "小说",
  "ref": "刘震云《一句顶一万句》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "不畏雨，不畏风，也不畏冬雪和酷暑。",
  "type": "诗歌",
  "ref": "宫泽贤治《不畏风雨》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign",
   "summer",
   "winter",
   "water",
   "rain",
   "nature"
  ]
 },
 {
  "text": "我劝天公重抖擞，不拘一格降人才。",
  "type": "诗歌",
  "ref": "龚自珍《己亥杂诗》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "我是雨和雪的老熟人了，我有九十岁了。雨雪看老了我，我也把它们给看老了。",
  "type": "小说",
  "ref": "迟子建《额尔古纳河右岸》",
  "origin": "中",
  "themes": [
   "novel",
   "book",
   "winter",
   "water",
   "rain"
  ]
 },
 {
  "text": "人类在小小的球上，睡觉、起床，然后劳动。",
  "type": "诗歌",
  "ref": "谷川俊太郎《二十亿光年的孤独》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "江山代有才人出，各领风骚数百年。",
  "type": "诗歌",
  "ref": "赵翼《论诗》",
  "origin": "中",
  "themes": [
   "poetry",
   "water",
   "nature"
  ]
 },
 {
  "text": "我们回不去了。",
  "type": "小说",
  "ref": "张爱玲《半生缘》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "若深情不能对等，愿爱得更多的人是我。",
  "type": "诗歌",
  "ref": "奥登《爱的更多的一个》",
  "origin": "外",
  "themes": [
   "poetry",
   "foreign"
  ]
 },
 {
  "text": "海日生残夜，江春入旧年。",
  "type": "诗歌",
  "ref": "王湾《次北固山下》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "night"
  ]
 },
 {
  "text": "侠之大者，为国为民。",
  "type": "小说",
  "ref": "金庸《神雕侠侣》",
  "origin": "中",
  "themes": [
   "novel",
   "book"
  ]
 },
 {
  "text": "我永远在沙岸上行走，在沙土和泡沫的中间。高潮会抹去我的脚印，风也会把泡沫吹走。",
  "type": "散文",
  "ref": "纪伯伦《沙与沫》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign",
   "journey",
   "nature"
  ]
 },
 {
  "text": "不知细叶谁裁出，二月春风似剪刀。",
  "type": "诗歌",
  "ref": "贺知章《咏柳》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "night",
   "moon",
   "nature"
  ]
 },
 {
  "text": "所谓命运，就是说，这一出人间戏剧需要各种各样的角色，而你只能是其中之一。",
  "type": "散文",
  "ref": "史铁生《病隙碎笔》",
  "origin": "中",
  "themes": [
   "book",
   "study"
  ]
 },
 {
  "text": "我说生命的确是黑暗的，除非是有了激励；一切的激励都是盲目的，除非是有了知识。",
  "type": "散文",
  "ref": "纪伯伦《先知·论工作》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign"
  ]
 },
 {
  "text": "少小离家老大回，乡音无改鬓毛衰。",
  "type": "诗歌",
  "ref": "贺知章《回乡偶书》",
  "origin": "中",
  "themes": [
   "poetry"
  ]
 },
 {
  "text": "我要做远方的忠诚的儿子，和物质的短暂情人。",
  "type": "现代诗歌",
  "ref": "海子《以梦为马》",
  "origin": "中",
  "themes": [
   "poetry",
   "journey"
  ]
 },
 {
  "text": "没有人是一座孤岛，可以自全。",
  "type": "散文",
  "ref": "约翰·多恩《沉思录》",
  "origin": "外",
  "themes": [
   "book",
   "study",
   "foreign"
  ]
 },
 {
  "text": "柴门闻犬吠，风雪夜归人。",
  "type": "诗歌",
  "ref": "刘长卿《逢雪宿芙蓉山主人》",
  "origin": "中",
  "themes": [
   "poetry",
   "winter",
   "night",
   "journey",
   "nature"
  ]
 },
 {
  "text": "你，一会看我，一会看云。我觉得，你看我时很远，你看云时很近。",
  "type": "现代诗歌",
  "ref": "顾城《远和近》",
  "origin": "中",
  "themes": [
   "poetry",
   "nature"
  ]
 },
 {
  "text": "美将拯救世界。",
  "type": "小说",
  "ref": "陀思妥耶夫斯基《白痴》",
  "origin": "外",
  "themes": [
   "novel",
   "book",
   "foreign"
  ]
 },
 {
  "text": "春潮带雨晚来急，野渡无人舟自横。",
  "type": "诗歌",
  "ref": "韦应物《滁州西涧》",
  "origin": "中",
  "themes": [
   "poetry",
   "spring",
   "water",
   "rain"
  ]
 },
 {
  "text": "那时我们有梦，关于文学，关于爱情，关于穿越世界的旅行。如今我们深夜饮酒，杯子碰到一起，都是梦破碎的声音。",
  "type": "现代诗歌",
  "ref": "北岛《波兰来客》",
  "origin": "中",
  "themes": [
   "poetry",
   "night"
  ]
 },
 {

 },

 {

   "study",
   "foreign",
   "nature"
  ]
 },
 {

 },
 {

  "themes": [

   "drama"

 },

      /* ---------------- 文案 ---------------- */
      function daySeed(d) {
        return parseInt(d.key, 10)

      function quoteIndex() {
        const base = Math.max(0, state.date.yearDay - 1)
        return (base + state.quoteOffset) % QUOTES.length
      }

      function getAutoEntry() {
        const term = currentSolarTerm(state.date)
        if (term && TERM_QUOTES[term.name]) {
          const season = termSeason(term.name)
          const pool = TERM_NAMES
            .filter(function (name) { return termSeason(name) === season && TERM_QUOTES[name] })
            .map(function (name) { return { name: name, quote: TERM_QUOTES[name] } })
          const currentIdx = pool.findIndex(function (item) { return item.name === term.name })
          const selected = pool[(currentIdx + state.quoteOffset) % pool.length]
          return Object.assign({}, selected.quote, {
            term: selected.name === term.name ? term.name : '',
            themes: [season, 'season', 'term', 'nature', 'poetry']
          })
        }
        return QUOTES[quoteIndex()]
      }

        if (state.textMode === 'manual') {

      }

        if (state.textMode === 'manual') {
          return state.manualSource.trim()

        const termTag = entry.term ? entry.term + ' · ' : ''
        return termTag + entry.type + ' · 摘自 ' + entry.ref
      }

      function matchedArts(entry) {
        const themes = entry.themes || []
        return ARTS.filter(function (art) {
          return art.themes.some(function (t) {
            return themes.indexOf(t) >= 0
          })
        })
      }

      function currentArt() {

      function currentArtSvg() {

        if (state.imgMode !== 'auto' || state.textMode === 'manual') return
        const pool = matchedArts(getAutoEntry())
        if (!pool.length) return
        const cur = currentArt()
        const inside = pool.some(function (art) { return art.name === cur.name })
        if (!inside) {
          const pick = pool[daySeed(state.date) % pool.length]
          state.artIndex = ARTS.indexOf(pick)

      }

        let pool
        if (state.textMode === 'manual') {
          pool = ARTS

          pool = matchedArts(getAutoEntry())
          if (!pool.length) pool = ARTS
        }
        const cur = currentArt()
        let idx = pool.findIndex(function (art) { return art.name === cur.name })
        if (idx < 0) idx = 0
        const next = pool[(idx + 1) % pool.length]
        state.artIndex = ARTS.indexOf(next)
      }

      /* ---------------- Canvas 工具 ---------------- */
      const SERIF = '"Noto Serif SC","Songti SC","STSong","SimSun",serif'
      const SANS = '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif'
      const DISPLAY = '"Smiley Sans Oblique","Smiley Sans","得意黑",sans-serif'
      const KAI = '"LXGW WenKai Screen","LXGW WenKai","Kaiti SC","STKaiti","KaiTi",serif'

      function font(px, style) {
        return (style || '400') + ' ' + px + 'px ' + SERIF
      }

      function sansFont(px, weight) {
        return (weight || '400') + ' ' + px + 'px ' + SANS
      }

      function displayFont(px, weight) {
        return (weight || '400') + ' ' + px + 'px ' + DISPLAY
      }

      function kaiFont(px, weight) {
        return (weight || '400') + ' ' + px + 'px ' + KAI
      }

      function line(x1, y1, x2, y2, color, width, dash) {
        ctx.strokeStyle = color
        ctx.lineWidth = width
        ctx.setLineDash(dash || [])
        ctx.beginPath()
        ctx.moveTo(x1, y1)
        ctx.lineTo(x2, y2)
        ctx.stroke()
        ctx.setLineDash([])
      }

      function fillText(text, x, y, style) {
        ctx.font = style.font
        ctx.fillStyle = style.color
        ctx.textAlign = style.align || 'left'
        ctx.textBaseline = style.baseline || 'alphabetic'
        ctx.fillText(text, x, y)
      }

      function wrapByWidth(text, maxWidth, fontSpec) {
        ctx.font = fontSpec
        const chars = Array.from(text)
        const lines = []
        let cur = ''
        for (let i = 0; i < chars.length; i++) {
          const next = cur + chars[i]
          if (cur && ctx.measureText(next).width > maxWidth) {
            lines.push(cur)
            cur = chars[i]
          } else {
            cur = next
          }
        }
        if (cur) lines.push(cur)
        return lines
      }

      function loadSvg(svg) {
        return new Promise(function (resolve, reject) {
          const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }))
          const img = new Image()
          img.onload = function () { URL.revokeObjectURL(url); resolve(img) }
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('SVG 载入失败')) }
          img.src = url
        })
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.arcTo(x + w, y, x + w, y + h, r)
        ctx.arcTo(x + w, y + h, x, y + h, r)
        ctx.arcTo(x, y + h, x, y, r)
        ctx.arcTo(x, y, x + w, y, r)
        ctx.closePath()
      }

        g.addColorStop(1, 'rgba(180,67,47,0)')
        ctx.fillStyle = g
        ctx.fillRect(0, 0, LW, LH)
      }

        const x1 = 50
        const x2 = LW - 50
        line(x1, 48, x2, 48, '#28261f', 2.5)
        line(x1, 92, x2, 92, '#28261f', 1)

        fillText('戏剧·诗歌·电影', x1, 78, {
          font: displayFont(22, '400'),
          color: '#28261f'
        })
        fillText('码字人日历', x2, 78, {
          font: displayFont(21, '400'),
          color: '#b4432f',
          align: 'right'
        })

        // 红色齿孔装饰
        ctx.fillStyle = 'rgba(180,67,47,.72)'
        for (let x = 58; x <= x2 - 8; x += 16) {
          ctx.beginPath()
          ctx.arc(x, 107, 2.3, 0, Math.PI * 2)
          ctx.fill()
        }
      }

      function drawDate(d) {
        const dayText = d.monthDay
        ctx.font = font(58, '900')
        const dayWidth = Math.ceil(ctx.measureText(dayText).width)
        fillText(dayText, 50, 190, {
          font: font(58, '900'),
          color: '#28261f'
        })
        const metaX = 50 + dayWidth + 24
        fillText(d.year + '年', metaX, 168, {
          font: font(15),
          color: '#6d675b'
        })
        fillText(d.weekday, metaX, 190, {
          font: font(15),
          color: '#6d675b'
        })

        const issue = '第 ' + d.yearDay + ' 场'
        ctx.font = sansFont(15)
        const iw = Math.ceil(ctx.measureText(issue).width)
        const ix = LW - 50 - iw - 28
        ctx.fillStyle = '#b4432f'
        ctx.fillRect(ix, 150, iw + 28, 42)
        fillText(issue, ix + (iw + 28) / 2, 176, {
          font: sansFont(15),
          color: '#f4ecdd',
          align: 'center'
        })

        line(50, 212, LW - 50, 212, 'rgba(40,38,31,.45)', 1)
      }

      function drawImageBlock(img) {
        const maxW = LW - 96
        const maxH = 316
        let w = maxW
        let h = maxH
        if (img && isFinite(img.width) && img.width > 0 && img.height > 0) {
          const aspect = img.width / img.height
          if (aspect > maxW / maxH) {
            w = maxW
            h = w / aspect
          } else {
            h = maxH
            w = h * aspect
          }
        }
        const y = 238
        const x = (LW - w) / 2

        // 纸框：完整显示图片，不做拉伸或裁切
        line(x - 9, y - 9, x + w + 9, y - 9, '#28261f', 1.2)
        line(x + w + 9, y - 9, x + w + 9, y + h + 9, '#28261f', 1.2)
        line(x + w + 9, y + h + 9, x - 9, y + h + 9, '#28261f', 1.2)
        line(x - 9, y + h + 9, x - 9, y - 9, '#28261f', 1.2)
        line(x - 4, y - 4, x + w + 4, y - 4, 'rgba(40,38,31,.5)', 1)
        line(x + w + 4, y - 4, x + w + 4, y + h + 4, 'rgba(40,38,31,.5)', 1)
        line(x + w + 4, y + h + 4, x - 4, y + h + 4, 'rgba(40,38,31,.5)', 1)
        line(x - 4, y + h + 4, x - 4, y - 4, 'rgba(40,38,31,.5)', 1)

        if (img) {
          if (state.imgMode === 'auto' && currentArt().filter && ctx.filter !== undefined) {
            ctx.save()
            ctx.filter = currentArt().filter
            ctx.drawImage(img, x, y, w, h)
            ctx.restore()
          } else {
            ctx.drawImage(img, x, y, w, h)
          }
        } else {
          ctx.fillStyle = '#d9cfb8'
          ctx.fillRect(x, y, w, h)
        }

        return y + h + 24
      }

      function layoutQuote(quoteText, quoteTop) {
        const maxW = LW - 156
        const top = quoteTop
        const availH = quoteTop > 400 ? (912 - 52 - quoteTop) : 610
        let size = quoteTop > 400 ? 32 : 40
        let lineHeight = 0
        let lines = []

        for (let guard = 0; guard < 8; guard++) {
          const spec = kaiFont(size, '400')
          lines = wrapByWidth(quoteText, maxW, spec)
          lineHeight = Math.round(size * 1.7)
          const fits = lines.length * lineHeight <= availH - 46
          if (fits || size <= 21) break
          size -= 2
        }

        const total = lines.length * lineHeight
        const y = top + Math.max(0, (availH - total - 46) / 2)
        return { lines: lines, size: size, lineHeight: lineHeight, y: y }
      }

      function drawQuote(d, quoteTop) {
        const quoteText = '「' + getQuoteText() + '」'
        const lay = layoutQuote(quoteText, quoteTop)

        for (let i = 0; i < lay.lines.length; i++) {
          fillText(lay.lines[i], 78, lay.y + i * lay.lineHeight + lay.size, {
            font: kaiFont(lay.size, '400'),
            color: '#28261f'
          })
        }

        const src = quoteSource()
        const lastBaseline = lay.y + (lay.lines.length - 1) * lay.lineHeight + lay.size
        const srcY = lastBaseline + 70
        fillText(src ? '—— ' + src : '', LW - 78, srcY, {
          font: sansFont(13),
          color: '#6d675b',
          align: 'right'
        })
      }

      function drawFooter(d) {
        line(50, 912, LW - 50, 912, 'rgba(40,38,31,.5)', 1, [2, 7])
        fillText('码字人日历 · 门票存根', 50, 950, {
          font: sansFont(13),
          color: '#6d675b'
        })
        fillText('场次 ' + d.yearDay + ' / ' + d.totalDays, LW - 50, 950, {
          font: sansFont(13),
          color: '#6d675b',
          align: 'right'
        })
      }

      /* ---------------- 渲染 ---------------- */
      function libraryText() {
        const parts = []
        QUOTES.forEach(function (q) {
          parts.push(q.text, q.ref)
        })
        Object.keys(TERM_QUOTES).forEach(function (name) {
          const q = TERM_QUOTES[name]
          parts.push(q.text, q.ref)
        })
        parts.push('码字人日历戏剧诗歌电影门票存根场次出处摘自年月日星期')
        return parts.join('')
      }

      function waitRenderFonts() {
        if (!document.fonts || !document.fonts.load) return Promise.resolve()
        const text = getQuoteText() + quoteSource() + libraryText()
        const jobs = [
          document.fonts.load(displayFont(16), '码字人日历戏剧诗歌电影'),
          document.fonts.load(font(16, '900'), state.date.monthDay + state.date.weekday + state.date.year + '年第场日月'),
          document.fonts.load(kaiFont(16), text),
          document.fonts.load(sansFont(16), text)
        ]
        const timeout = new Promise(function (resolve) {
          setTimeout(resolve, 2500)
        })
        return Promise.race([Promise.all(jobs), timeout])
      }

      async function render() {
        const token = ++renderToken
        await waitRenderFonts()
        if (token !== renderToken) return
        ctx.clearRect(0, 0, LW, LH)
        drawPaper()
        drawMasthead(state.date)
        drawDate(state.date)

        let img = null
        if (state.imgMode === 'auto') {
          try {
            img = await loadSvg(currentArtSvg())
          } catch (e) {
            img = null
          }
        } else if (state.imgMode === 'upload' && state.uploadedUrl) {
          try {
            img = await loadUrlImage(state.uploadedUrl)
          } catch (e) {
            img = null
          }
        }

        if (token !== renderToken) return
        let quoteTop = 250
        if (state.imgMode !== 'none') {
          quoteTop = drawImageBlock(img)
        }
        drawQuote(state.date, quoteTop)
        drawFooter(state.date)
      }

      function loadUrlImage(url) {
        return new Promise(function (resolve, reject) {
          const img = new Image()
          img.onload = function () { resolve(img) }
          img.onerror = function () { reject(new Error('图片载入失败')) }
          img.src = url
        })
      }

      /* ---------------- 下载 ---------------- */
      function downloadImage(kind) {
        const d = state.date
        const isPng = kind === 'png'
        const ext = isPng ? 'png' : 'jpg'
        const mime = isPng ? 'image/png' : 'image/jpeg'
        const name = '码字人日历-' + d.key + '.' + ext
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) {
            if (!blob) return
            triggerDownload(URL.createObjectURL(blob), name)
          }, mime, isPng ? undefined : 0.92)
        } else {
          triggerDownload(canvas.toDataURL(mime, isPng ? undefined : 0.92), name)
        }
      }

      function triggerDownload(href, name) {
        const a = document.createElement('a')
        a.href = href
        a.download = name
        document.body.appendChild(a)
        a.click()
        a.remove()
      }

      /* ---------------- 介面 ---------------- */
      function syncControls() {
        els.textAuto.setAttribute('aria-pressed', String(state.textMode === 'auto'))
        els.textManual.setAttribute('aria-pressed', String(state.textMode === 'manual'))
        els.manualFields.classList.toggle('show', state.textMode === 'manual')
        if (state.textMode === 'manual') {
          if (document.activeElement !== els.manual) els.manual.value = state.manual
          if (document.activeElement !== els.manualSource) els.manualSource.value = state.manualSource
        }

        els.imgButtons.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.img === state.imgMode))
        })

        els.shuffle.classList.toggle('hidden', state.textMode !== 'auto')
        els.swapImg.classList.toggle('hidden', state.imgMode !== 'auto')

        els.headerDate.textContent =
          state.date.dateText + ' · ' + state.date.weekday + ' · 第 ' + state.date.yearDay + ' 场'
        els.dateHint.textContent = state.date.monthDay + ' ' + state.date.weekday
      }

      function saveManualToStorage() {
        try {
          const key = 'daily-calendar-manual-' + state.date.key
          if (state.manual.trim() || state.manualSource.trim()) {
            localStorage.setItem(key, JSON.stringify({ text: state.manual, source: state.manualSource }))
          }
          else localStorage.removeItem(key)
        } catch (e) { /* 忽略 */ }
      }

      function loadManualFromStorage() {
        try {
          const key = 'daily-calendar-manual-' + state.date.key
          const saved = localStorage.getItem(key)
          const data = saved ? JSON.parse(saved) : null
          state.manual = data && data.text ? data.text : ''
          state.manualSource = data && data.source ? data.source : ''
          els.manual.value = state.manual
          els.manualSource.value = state.manualSource
        } catch (e) { /* 忽略 */ }
      }

      els.textAuto.addEventListener('click', function () {
        state.textMode = 'auto'
        chooseAutoArtIfNeeded()
        syncControls()
        render()
      })

      els.textManual.addEventListener('click', function () {
        state.textMode = 'manual'
        syncControls()
        els.manual.focus()
        render()
      })

      els.manual.addEventListener('input', function () {
        state.manual = els.manual.value
        saveManualToStorage()
        render()
      })

      els.manualSource.addEventListener('input', function () {
        state.manualSource = els.manualSource.value
        saveManualToStorage()
        render()
      })

      els.imgButtons.forEach(function (b) {
        b.addEventListener('click', function () {
          state.imgMode = b.dataset.img
          if (b.dataset.img === 'auto') {
            chooseAutoArtIfNeeded()
          }
          syncControls()
          render()
        })
      })

      els.upload.addEventListener('change', function () {
        const file = els.upload.files && els.upload.files[0]
        if (!file) return
        const url = URL.createObjectURL(file)
        state.uploadedUrl = url
        state.imgMode = 'upload'
        syncControls()
        render()
        els.upload.value = ''
      })

      els.shuffle.addEventListener('click', function () {
        state.textMode = 'auto'
        state.quoteOffset += 1
        chooseAutoArtIfNeeded()
        syncControls()
        render()
      })

      els.swapImg.addEventListener('click', function () {
        advanceArt()
        render()
      })

      els.download.addEventListener('click', function () {
        downloadImage('png')
      })
      els.downloadJpg.addEventListener('click', function () {
        downloadImage('jpg')
      })

      /* ---------------- 启动 ---------------- */
      function boot() {
        loadManualFromStorage()
        syncControls()
        render().then(function () {
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
              render()
            })
          }
        })
      }
      if (document.fonts && document.fonts.load) {
        const lib = libraryText()
        Promise.all([
          document.fonts.load('400 20px "Smiley Sans Oblique"', '码字人日历戏剧诗歌电影'),
          document.fonts.load('900 20px "Noto Serif SC"', lib),
          document.fonts.load('400 20px "LXGW WenKai Screen"', lib),
          document.fonts.load('400 20px "Noto Sans SC"', lib)
        ]).then(boot, boot)
      } else {
        boot()
      }
    })()
  </script>
</body>
</html>
